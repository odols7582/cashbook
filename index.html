<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사업자장부">
<title>사업자 장부</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #FAFAF7; color: #1A1A1A; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  :root {
    --bg: #FAFAF7; --paper: #FFFFFF; --ink: #1A1A1A; --ink-soft: #4A4A4A; --ink-dim: #8A8A8A;
    --line: #E2E2DC; --line-soft: #F0F0EA; --accent: #1A56DB; --green: #0A7D3F; --red: #C53030; --highlight: #FFF9E6;
  }

  /* 상단 연결 상태 바 */
  .sync-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    padding: 8px 16px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.3s;
  }
  .sync-bar.connected { background: #ECFDF5; color: #065F46; border-bottom: 1px solid #A7F3D0; }
  .sync-bar.connecting { background: #FFFBEB; color: #92400E; border-bottom: 1px solid #FDE68A; }
  .sync-bar.offline { background: #FEF2F2; color: #991B1B; border-bottom: 1px solid #FECACA; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
  .sync-bar.connected .sync-dot { background: #10B981; }
  .sync-bar.connecting .sync-dot { background: #F59E0B; animation: pulse 1s infinite; }
  .sync-bar.offline .sync-dot { background: #EF4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .root { min-height: 100vh; padding: 60px 24px 80px; }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .loading-text { font-size: 14px; color: var(--ink-soft); }
  @keyframes spin { to { transform: rotate(360deg); } }

  header.app-header { max-width: 1280px; margin: 0 auto 20px; }
  .title-row { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
  .title { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .subtitle { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0 0; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .last-sync { font-size: 11px; color: var(--ink-dim); }

  nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav.tabs button {
    background: transparent; border: none; padding: 10px 16px;
    color: var(--ink-soft); font-size: 13px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    font-family: inherit;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .badge { background: var(--accent); color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 700; }

  .summary { max-width: 1280px; margin: 0 auto 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .summary-3 { grid-template-columns: repeat(3, 1fr); }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; }
  .stat-main { background: linear-gradient(135deg, #F0F4FF 0%, #FFFFFF 100%); border-color: #C8D6FF; }
  .stat-label { font-size: 11px; color: var(--ink-soft); font-weight: 500; }
  .stat-val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .toolbar { max-width: 1280px; margin: 0 auto 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button.btn-primary { background: var(--accent); color: white; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  button.btn-primary:hover:not(:disabled) { background: #1e4cbf; }
  button.btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  button.btn-ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; font-family: inherit; }
  button.btn-ghost:hover { background: var(--line-soft); }
  select.select-input { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; color: var(--ink); font-family: inherit; }
  .search { position: relative; flex: 1; max-width: 240px; }
  .search input { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 28px 8px 10px; font-size: 13px; font-family: inherit; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .clear-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--ink-dim); cursor: pointer; font-size: 16px; padding: 2px 6px; }
  .count { margin-left: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .table-wrap { max-width: 1280px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table thead th { background: #F5F5EF; border-bottom: 2px solid var(--line); padding: 9px 10px; text-align: left; font-weight: 700; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
  table.data-table thead th.num { text-align: right; }
  table.data-table thead th.center { text-align: center; }
  table.data-table tbody td { padding: 0; border-bottom: 1px solid var(--line-soft); background: var(--paper); transition: background 0.1s; }
  table.data-table tbody tr:hover td { background: #FAFAF5; }
  table.data-table td.num { text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; }
  table.data-table tfoot td { background: #F5F5EF; border-top: 2px solid var(--line); padding: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .cell-input { width: 100%; border: none; background: transparent; padding: 10px 10px; font-size: 13px; font-family: inherit; color: var(--ink); }
  .cell-input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--highlight); }
  .num-input { text-align: right; font-variant-numeric: tabular-nums; }
  .deposit-cell { color: var(--green); font-weight: 600; }
  .withdraw-cell { color: var(--red); font-weight: 600; }
  .date-cell { color-scheme: light; font-variant-numeric: tabular-nums; }
  .balance-cell { font-weight: 700; padding: 10px; }
  .cat-select { width: 100%; border: none; background: transparent; padding: 10px 6px; font-size: 12px; font-family: inherit; cursor: pointer; color: var(--ink); }
  .cat-select:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cat-select:disabled { color: var(--ink-dim); cursor: not-allowed; }
  .tax-cell { text-align: center; padding: 0 !important; }
  .tax-check { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 7px 4px; gap: 2px; }
  .tax-check input { display: none; }
  .tax-box { width: 20px; height: 20px; border: 1.5px solid var(--line); border-radius: 4px; display: flex; align-items: center; justify-content: center; background: white; font-size: 13px; font-weight: 700; color: white; transition: all 0.1s; }
  .tax-check input:checked + .tax-box { background: var(--accent); border-color: var(--accent); }
  .tax-check input:disabled + .tax-box { background: #F1F5F9; border-color: #E2E8F0; }
  .tax-hint { font-size: 10px; color: var(--ink-dim); }
  .actions-cell { text-align: right; padding-right: 6px; white-space: nowrap; }
  .icon-btn { background: transparent; border: none; color: var(--ink-dim); cursor: pointer; width: 26px; height: 26px; border-radius: 6px; font-size: 14px; line-height: 1; transition: all 0.15s; font-family: inherit; }
  .icon-btn:hover { background: var(--line-soft); color: var(--ink); }
  .icon-btn.del-btn:hover { background: #FFEBEA; color: var(--red); }
  .empty-cell { text-align: center; padding: 50px 20px !important; color: var(--ink-dim); font-size: 13px; }
  .footer-hint { max-width: 1280px; margin: 14px auto 0; font-size: 12px; color: var(--ink-dim); text-align: center; line-height: 1.6; }

  /* 리포트 */
  .report-head { max-width: 1280px; margin: 0 auto 14px; display: flex; justify-content: space-between; align-items: center; }
  .report-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .panel { max-width: 1280px; margin: 0 auto 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .panel-title { font-size: 14px; font-weight: 700; margin: 0 0 14px 0; }
  .grid-2 { max-width: 1280px; margin: 0 auto 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-2 > .panel { margin: 0; max-width: none; }
  .mini-empty { text-align: center; padding: 36px 20px; color: var(--ink-dim); font-size: 13px; }
  .cat-list { margin-top: 10px; }
  .cat-item { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
  .cat-item:last-child { border-bottom: none; }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .cat-val { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-soft); }
  .bar-chart { width: 100%; height: 260px; display: flex; align-items: flex-end; justify-content: space-around; gap: 6px; padding: 16px 10px 28px; position: relative; border-bottom: 1px solid var(--line); }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; position: relative; }
  .bar-bars { display: flex; gap: 2px; align-items: flex-end; height: 200px; }
  .bar { width: 14px; border-radius: 3px 3px 0 0; transition: height 0.4s ease; min-height: 2px; }
  .bar-label { font-size: 10px; color: var(--ink-soft); margin-top: 3px; }
  .chart-legend { display: flex; gap: 14px; justify-content: center; margin-top: 8px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .bar-tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1A1A1A; color: white; padding: 5px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; margin-bottom: 4px; }
  .bar-group:hover .bar-tooltip { opacity: 1; }
  .pie-wrap { display: flex; align-items: center; justify-content: center; height: 180px; }
  .pie { width: 140px; height: 140px; }
  .mini-table { font-size: 13px; }
  .mini-table th { padding: 9px 10px; }
  .mini-table td { padding: 9px 10px; }

  /* VAN FEE */
  .van-sim-input { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; margin-bottom: 12px; }
  .van-sim-input label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .van-sim-input input { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; font-variant-numeric: tabular-nums; text-align: right; }
  .van-sim-input input:focus { outline: none; border-color: var(--accent); }
  .van-fee-input { width: 72px; border: none; background: transparent; padding: 8px 8px; font-size: 13px; font-family: inherit; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .van-fee-input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--highlight); }
  .van-percent { color: #9333EA; font-weight: 600; }
  .van-profit { color: var(--green); font-weight: 700; }
  .van-loss { color: var(--red); font-weight: 700; }
  .card-type { font-size: 11px; padding: 2px 7px; border-radius: 100px; display: inline-block; }
  .card-credit { background: #E0E7FF; color: #3730A3; }
  .card-debit { background: #DCFCE7; color: #166534; }

  /* 할일 */
  .filter-chips { display: flex; gap: 6px; }
  .chip { background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft); padding: 6px 12px; border-radius: 100px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; display: flex; align-items: center; gap: 5px; font-family: inherit; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
  .chip-n { font-size: 10px; padding: 1px 5px; background: rgba(0,0,0,0.08); border-radius: 10px; font-variant-numeric: tabular-nums; }
  .chip.active .chip-n { background: rgba(255,255,255,0.2); }
  .add-card { max-width: 1280px; margin: 0 auto 12px; background: var(--paper); border: 1px solid var(--accent); border-radius: 10px; padding: 16px; }
  .add-title-input { width: 100%; border: none; background: transparent; font-size: 16px; font-weight: 600; padding: 4px 0; color: var(--ink); outline: none; font-family: inherit; }
  .add-meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .prio-picker { display: flex; gap: 4px; }
  .prio-btn { background: var(--paper); border: 1px solid var(--line); padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--ink-soft); font-weight: 500; font-family: inherit; }
  .add-date-input, .add-memo-input { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: inherit; }
  .add-memo-input { flex: 1; min-width: 160px; }
  .add-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .todo-list { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .todo { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; transition: all 0.15s; }
  .todo:hover { border-color: #94a3b8; }
  .todo.done { opacity: 0.6; background: #FAFAF7; }
  .todo.overdue { border-left: 3px solid var(--red); }
  .todo-check { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; color: white; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; }
  .todo-check:hover { border-color: var(--accent); }
  .todo-body { min-width: 0; }
  .todo-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .todo-prio { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .todo-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .todo.done .todo-title { text-decoration: line-through; color: var(--ink-dim); }
  .todo-due { font-size: 11px; color: var(--ink-soft); background: var(--line-soft); padding: 2px 7px; border-radius: 4px; }
  .todo-due.overdue { background: #FEF2F2; color: var(--red); font-weight: 600; }
  .todo-memo { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .empty-page { max-width: 500px; margin: 40px auto; text-align: center; background: var(--paper); border: 2px dashed var(--line); border-radius: 16px; padding: 50px 30px; }
  .empty-icon { font-size: 44px; margin-bottom: 14px; }
  .empty-page h3 { font-size: 16px; font-weight: 700; margin: 0 0 6px 0; }
  .empty-page p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  /* 백업 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--paper); border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 12px; }
  .modal-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .modal-close { background: var(--line-soft); border: none; color: var(--ink-soft); font-size: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; line-height: 1; font-family: inherit; }
  .modal-body { padding: 0 22px 18px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--line-soft); }
  .backup-section { margin-bottom: 18px; }
  .backup-section h4 { font-size: 14px; font-weight: 600; margin: 0 0 6px 0; }
  .backup-section p { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px 0; line-height: 1.5; }
  .file-input { display: none; }
  .file-label { display: inline-block; padding: 9px 16px; background: var(--accent); color: white; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }

  /* 모바일 바텀 네비 */
  .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 1px solid var(--line); z-index: 50; padding: 4px 0 env(safe-area-inset-bottom); }
  .bottom-nav-inner { display: flex; }
  .bottom-nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; background: transparent; border: none; cursor: pointer; font-size: 10px; color: var(--ink-dim); font-family: inherit; transition: color 0.15s; }
  .bottom-nav-btn.active { color: var(--accent); }
  .bottom-nav-btn span:first-child { font-size: 20px; }


  /* VAN FEE 가계산 */
  .calc-form { max-width: 600px; margin: 0 auto 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .calc-form h3 { font-size: 16px; font-weight: 700; margin: 0 0 20px 0; }
  .calc-field { margin-bottom: 16px; }
  .calc-field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: 0.03em; text-transform: uppercase; }
  .calc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .calc-chip { background: var(--bg); border: 1.5px solid var(--line); color: var(--ink-soft); padding: 7px 14px; border-radius: 100px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; font-family: inherit; }
  .calc-chip:hover { border-color: var(--accent); color: var(--accent); }
  .calc-chip.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
  .calc-select { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--ink); background: var(--paper); cursor: pointer; }
  .calc-select:focus { outline: none; border-color: var(--accent); }
  .calc-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--ink); background: var(--paper); text-align: right; font-variant-numeric: tabular-nums; }
  .calc-input:focus { outline: none; border-color: var(--accent); }
  .calc-result { max-width: 600px; margin: 0 auto; }
  .result-card { background: linear-gradient(135deg, #1A56DB 0%, #2563EB 100%); border-radius: 14px; padding: 24px; color: white; margin-bottom: 12px; }
  .result-card .r-label { font-size: 12px; opacity: 0.8; font-weight: 500; margin-bottom: 6px; }
  .result-card .r-val { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .result-card .r-sub { font-size: 13px; opacity: 0.75; margin-top: 6px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .result-item { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .result-item .r-label { font-size: 11px; color: var(--ink-dim); font-weight: 500; margin-bottom: 4px; }
  .result-item .r-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .result-note { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 10px; padding: 14px 16px; font-size: 12px; color: #92400E; line-height: 1.6; }
  .rate-table-wrap { max-width: 1280px; margin: 20px auto 0; }
  .rate-table-wrap h3 { font-size: 14px; font-weight: 700; margin: 0 0 10px 0; color: var(--ink-soft); }
  .rate-table { width: 100%; border-collapse: collapse; font-size: 11px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .rate-table th { background: #1A56DB; color: white; padding: 6px 8px; text-align: center; font-weight: 600; white-space: nowrap; }
  .rate-table th.dark { background: #1e3a5f; }
  .rate-table td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .rate-table tr:last-child td { border-bottom: none; }
  .rate-table td:first-child { text-align: left; font-weight: 600; color: var(--ink); background: #F8F8F4; min-width: 130px; }

// ============ Firebase 저장 ============
let saveTimer = {};
function fbSave(path, data, delay=400) {
  clearTimeout(saveTimer[path]);
  saveTimer[path] = setTimeout(async () => {
    try {
      await set(ref(db, path), data);
      S.lastSync = new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
      updateSyncBar("connected");
      render();
    } catch(e) {
      updateSyncBar("offline");
      console.error(e);
    }
  }, delay);
}
function saveRows()  { fbSave("cashbook/rows", S.rows); }
function saveTodos() { fbSave("cashbook/todos", S.todos); }
function saveVan()   { fbSave("cashbook/van", S.van); }

function updateSyncBar(status) {
  const bar = document.getElementById("sync-bar");
  const txt = document.getElementById("sync-text");
  if(!bar||!txt) return;
  bar.className = "sync-bar " + status;
  if(status==="connected") txt.textContent = "✓ 실시간 동기화 중 " + (S.lastSync ? `· 마지막 저장 ${S.lastSync}` : "");
  else if(status==="connecting") txt.textContent = "Firebase 연결 중…";
  else txt.textContent = "오프라인 · 네트워크 연결을 확인하세요";
}

// ============ Firebase 실시간 리슨 ============
async function initFirebase() {
  try {
    // 첫 로드: 데이터 존재 여부 확인
    const snap = await get(ref(db, "cashbook"));
    if(!snap.exists()) {
      // 첫 실행: 초기 데이터 Firebase에 저장
      await set(ref(db,"cashbook/rows"), INIT_ROWS);
      await set(ref(db,"cashbook/todos"), []);
      await set(ref(db,"cashbook/van"), {cards:INIT_VAN_CARDS, simAmount:50000});
    }

    // 실시간 감지
    onValue(ref(db,"cashbook/rows"), snap => {
      S.rows = snap.val() ? Object.values(snap.val()) : [];
      render();
    });
    onValue(ref(db,"cashbook/todos"), snap => {
      S.todos = snap.val() ? Object.values(snap.val()) : [];
      render();
    });
    onValue(ref(db,"cashbook/van"), snap => {
      if(snap.val()) {
        S.van = snap.val();
        if(!S.van.cards) S.van.cards = INIT_VAN_CARDS;
        else if(!Array.isArray(S.van.cards)) S.van.cards = Object.values(S.van.cards);
      }
      render();
    });

    updateSyncBar("connected");
  } catch(e) {
    updateSyncBar("offline");
    console.error(e);
    // 오프라인 fallback: localStorage
    try {
      S.rows = JSON.parse(localStorage.getItem("cb_rows")||"null") || INIT_ROWS;
      S.todos = JSON.parse(localStorage.getItem("cb_todos")||"null") || [];
      S.van = JSON.parse(localStorage.getItem("cb_van")||"null") || {cards:INIT_VAN_CARDS,simAmount:50000};
    } catch { S.rows=INIT_ROWS; S.todos=[]; }
    render();
  }
}

function switchTab(t) { S.tab=t; render(); }

// ============ 입출금장부 ============
function renderLedger() {
  const {filterMonth,filterCat,search} = S.ledger;
  const sorted = [...S.rows].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id));
  let running=0;
  const withBal = sorted.map(r=>{ running+=(r.deposit||0)-(r.withdraw||0); return {...r,balance:running}; });
  const months = [...new Set(S.rows.map(r=>monthKey(r.date)).filter(Boolean))].sort().reverse();
  const filtered = withBal.filter(r=>{
    if(filterMonth!=="all"&&!(r.date||"").startsWith(filterMonth)) return false;
    if(filterCat!=="all"&&r.category!==filterCat) return false;
    if(search&&!(r.memo||"").toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  const totDep=filtered.reduce((s,r)=>s+(r.deposit||0),0);
  const totWith=filtered.reduce((s,r)=>s+(r.withdraw||0),0);
  const curBal=withBal.length>0?withBal[withBal.length-1].balance:0;
  const taxPending=S.rows.filter(r=>(r.deposit||r.withdraw)&&!r.taxInvoice).length;

  return `
    <div class="summary">
      <div class="stat"><span class="stat-label">총 입금</span><span class="stat-val" style="color:#0A7D3F">+${fmt(totDep)}원</span></div>
      <div class="stat"><span class="stat-label">총 출금</span><span class="stat-val" style="color:#C53030">-${fmt(totWith)}원</span></div>
      <div class="stat stat-main"><span class="stat-label">현재 잔액</span><span class="stat-val" style="color:${curBal>=0?"#1A56DB":"#C53030"}">${fmt(curBal)}원</span></div>
      <div class="stat" style="${taxPending>0?"border-color:#F59E0B;background:#FFFBEB":""}">
        <span class="stat-label">세금계산서 미처리</span>
        <span class="stat-val" style="color:${taxPending>0?"#D97706":"#64748B"};font-size:18px">${taxPending}건</span>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn-primary" onclick="addRow()">＋ 새 거래</button>
      <select class="select-input" onchange="setFM(this.value)">
        <option value="all" ${filterMonth==="all"?"selected":""}>전체 기간</option>
        ${months.map(m=>`<option value="${m}" ${filterMonth===m?"selected":""}>${m.replace("-",".")}월</option>`).join("")}
      </select>
      <select class="select-input" onchange="setFC(this.value)">
        <option value="all" ${filterCat==="all"?"selected":""}>전체 카테고리</option>
        <optgroup label="입금">${DEP_CATS.map(c=>`<option value="${c.id}" ${filterCat===c.id?"selected":""}>${c.label}</option>`).join("")}</optgroup>
        <optgroup label="출금">${WITH_CATS.map(c=>`<option value="${c.id}" ${filterCat===c.id?"selected":""}>${c.label}</option>`).join("")}</optgroup>
      </select>
      <div class="search">
        <input placeholder="비고 검색…" value="${escapeHtml(search)}" oninput="setSearch(this.value)">
        ${search?`<button class="clear-btn" onclick="setSearch('')">×</button>`:""}
      </div>
      <button class="btn-ghost" onclick="exportCSV()">📥 CSV</button>
      <div class="count">${filtered.length}건</div>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr>
        <th style="width:110px">날짜</th>
        <th style="width:115px" class="num">입금</th>
        <th style="width:115px" class="num">출금</th>
        <th style="width:115px" class="num">잔액</th>
        <th style="width:115px">카테고리</th>
        <th style="width:70px" class="center">세금계산서</th>
        <th>비고</th>
        <th style="width:60px"></th>
      </tr></thead>
      <tbody>
        ${filtered.length===0?`<tr><td colspan="8" class="empty-cell">${S.rows.length===0?"거래 내역이 없습니다.":"조건에 맞는 거래가 없습니다."}</td></tr>`:
          filtered.map(r=>renderRow(r)).join("")}
      </tbody>
      ${filtered.length>0?`<tfoot><tr>
        <td><b>소계</b></td>
        <td class="num" style="color:#0A7D3F"><b>${fmt(totDep)}</b></td>
        <td class="num" style="color:#C53030"><b>${fmt(totWith)}</b></td>
        <td class="num"><b>${fmt(totDep-totWith)}</b></td>
        <td colspan="4"></td>
      </tr></tfoot>`:""}
    </table></div>
    <div class="footer-hint">💡 세금계산서: 입금 시 <b>발행여부</b>, 출금 시 <b>수신여부</b></div>
  `;
}

function renderRow(r) {
  const isD=!!r.deposit, isW=!!r.withdraw;
  const catList=isD?DEP_CATS:isW?WITH_CATS:[];
  const cat=ALL_CATS.find(c=>c.id===r.category);
  return `<tr>
    <td><input type="date" class="cell-input date-cell" value="${r.date||""}" onchange="updRow('${r.id}','date',this.value)"></td>
    <td class="num"><input type="text" inputmode="numeric" class="cell-input num-input deposit-cell" value="${r.deposit!=null?fmt(r.deposit):""}" placeholder="-"
      onfocus="numFocus(this)" onblur="numBlur(this,'${r.id}','deposit')" oninput="numIn(this)"></td>
    <td class="num"><input type="text" inputmode="numeric" class="cell-input num-input withdraw-cell" value="${r.withdraw!=null?fmt(r.withdraw):""}" placeholder="-"
      onfocus="numFocus(this)" onblur="numBlur(this,'${r.id}','withdraw')" oninput="numIn(this)"></td>
    <td class="num balance-cell" style="color:${r.balance>=0?"#1A56DB":"#C53030"}">${fmt(r.balance)}</td>
    <td><select class="cat-select" ${cat?`style="color:${cat.color};font-weight:600"`:""} ${(!isD&&!isW)?"disabled":""} onchange="updRow('${r.id}','category',this.value)">
      <option value="">미분류</option>
      ${catList.map(c=>`<option value="${c.id}" ${r.category===c.id?"selected":""}>${c.label}</option>`).join("")}
    </select></td>
    <td class="tax-cell"><label class="tax-check">
      <input type="checkbox" ${r.taxInvoice?"checked":""} ${(!isD&&!isW)?"disabled":""} onchange="updRow('${r.id}','taxInvoice',this.checked)">
      <span class="tax-box">${r.taxInvoice?"✓":""}</span>
      <span class="tax-hint">${isD?"발행":isW?"수신":"—"}</span>
    </label></td>
    <td><input type="text" class="cell-input" value="${escapeHtml(r.memo||"")}" placeholder="메모…" onchange="updRow('${r.id}','memo',this.value)"></td>
    <td class="actions-cell">
      <button class="icon-btn" onclick="dupRow('${r.id}')">⎘</button>
      <button class="icon-btn del-btn" onclick="delRow('${r.id}')">×</button>
    </td>
  </tr>`;
}

function numFocus(el) { el.value=el.value.replace(/,/g,""); el.select(); }
function numIn(el) { el.value=el.value.replace(/[^\d]/g,""); }
function numBlur(el,id,field) {
  const raw=el.value.replace(/[^\d]/g,"");
  const num=raw===""?null:parseInt(raw,10);
  el.value=num!=null?fmt(num):"";
  updRow(id,field,num);
}
function updRow(id,field,value) {
  S.rows=S.rows.map(r=>{ if(r.id!==id) return r;
    let v=value;
    if(field==="deposit"||field==="withdraw") v=(value===""||value==null)?null:Number(value);
    else if(field==="category") v=(value==="")?null:value;
    return {...r,[field]:v};
  });
  saveRows();
}
function addRow() {
  const newRow={id:uid(),date:todayISO(),deposit:null,withdraw:null,category:null,taxInvoice:false,memo:""};
  S.rows=[...S.rows,newRow];
  saveRows(); render();
}
function delRow(id) {
  if(!confirm("이 행을 삭제하시겠습니까?")) return;
  S.rows=S.rows.filter(r=>r.id!==id); saveRows();
}
function dupRow(id) {
  const t=S.rows.find(r=>r.id===id); if(!t) return;
  S.rows=[...S.rows,{...t,id:uid()}]; saveRows(); render();
}
function setFM(v){ S.ledger.filterMonth=v; render(); }
function setFC(v){ S.ledger.filterCat=v; render(); }
function setSearch(v){ S.ledger.search=v; render(); }
function exportCSV() {
  const sorted=[...S.rows].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let r2=0; const wBal=sorted.map(r=>{ r2+=(r.deposit||0)-(r.withdraw||0); return {...r,balance:r2}; });
  const hdr="날짜,입금,출금,잔액,카테고리,세금계산서,비고\n";
  const body=wBal.map(r=>{
    const cat=ALL_CATS.find(c=>c.id===r.category)?.label||"";
    return `${r.date},${r.deposit||0},${r.withdraw||0},${r.balance},${cat},${r.taxInvoice?"처리완":"미처리"},"${(r.memo||"").replace(/"/g,'""')}"`;
  }).join("\n");
  dl("\uFEFF"+hdr+body,"cashbook_"+todayISO()+".csv","text/csv;charset=utf-8;");
}
function dl(content,name,type) {
  const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}

// ============ 월별 리포트 ============
function renderReport() {
  const map={};
  S.rows.forEach(r=>{ const m=monthKey(r.date); if(!m) return;
    if(!map[m]) map[m]={month:m,deposit:0,withdraw:0};
    map[m].deposit+=(r.deposit||0); map[m].withdraw+=(r.withdraw||0); });
  const monthly=Object.values(map).sort((a,b)=>a.month.localeCompare(b.month))

function makePie(data) {
  const total=data.reduce((s,d)=>s+d.value,0); if(total===0) return "";
  let cur=-90; const cx=70,cy=70,r=60;
  const paths=data.map(d=>{
    const a=(d.value/total)*360; const sa=cur; const ea=cur+a; cur=ea;
    if(a>=360) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}"/>`;
    const x1=cx+r*Math.cos(sa*Math.PI/180),y1=cy+r*Math.sin(sa*Math.PI/180);
    const x2=cx+r*Math.cos(ea*Math.PI/180),y2=cy+r*Math.sin(ea*Math.PI/180);
    return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${a>180?1:0} 1 ${x2} ${y2} Z" fill="${d.color}"/>`;
  }).join("");
  return `<svg class="pie" viewBox="0 0 140 140">${paths}</svg>`;
}

function renderVan() {
  const cards=[...S.van.cards].sort((a,b)=>(a.type==="credit"&&b.type!=="credit"?-1:a.type!=="credit"&&b.type==="credit"?1:(a.order||0)-(b.order||0)));

  const cr=cards.filter(c=>c.type==="credit"), db=cards.filter(c=>c.type==="debit");
  const avgCR=cr.length?cr.reduce((s,c)=>s+c.merchantRate,0)/cr.length:0;
  const avgDB=db.length?db.reduce((s,c)=>s+c.merchantRate,0)/db.length:0;
  const avgVF=cards.length?cards.reduce((s,c)=>s+c.vanFee,0)/cards.length:0;
  return `
    <div class="summary">
      <div class="stat"><span class="stat-label">등록 카드사</span><span class="stat-val" style="color:#1A56DB;font-size:20px">${cards.length}개</span></div>
      <div class="stat"><span class="stat-label">신용 평균 수수료율</span><span class="stat-val" style="color:#9333EA;font-size:20px">${avgCR.toFixed(2)}%</span></div>
      <div class="stat"><span class="stat-label">체크 평균 수수료율</span><span class="stat-val" style="color:#0891B2;font-size:20px">${avgDB.toFixed(2)}%</span></div>
      <div class="stat"><span class="stat-label">평균 VAN FEE</span><span class="stat-val" style="color:#C53030;font-size:20px">${fmt(Math.round(avgVF))}원</span></div>
    </div>
    <div class="panel">
      <h3 class="panel-title">💡 결제금액 시뮬레이션</h3>
      <div class="van-sim-input">
        <label>가맹점 결제금액</label>
        <input type="text" inputmode="numeric" value="${fmt(sim)}"
          onfocus="this.value=this.value.replace(/,/g,'');this.select()"
          onblur="simBlur(this)" oninput="this.value=this.value.replace(/[^\\d]/g,'')">
      </div>
      <div style="font-size:12px;color:var(--ink-dim)">※ 이 금액으로 결제 시 카드사별 수수료·VAN FEE·대리점 이익을 자동 계산합니다.</div>
    </div>
    <div class="toolbar">
      <button class="btn-primary" onclick="addVC('credit')">＋ 신용카드</button>
      <button class="btn-primary" onclick="addVC('debit')" style="background:#0891B2">＋ 체크카드</button>
      <button class="btn-ghost" onclick="exportVanCSV()" style="margin-left:auto">📥 CSV</button>
      <button class="btn-ghost" onclick="resetVan()" style="color:var(--red)">⟲ 초기화</button>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr>
        <th style="width:50px">구분</th><th style="width:130px">카드사</th>
        <th style="width:110px" class="num">수수료율(%)</th>
        <th style="width:120px" class="num">수수료(${fmt(sim)}원)</th>
        <th style="width:110px" class="num">VAN FEE</th>
        <th class="num">대리점 이익</th>

          cards.map(c=>renderVanRow(c,sim)).join("")}

      ${cards.length>0?renderVanFoot(cards,sim):""}

}
function renderVanRow(c,sim) {
  const fee=sim*c.merchantRate/100, profit=fee-c.vanFee;
  const rate=sim>0?(profit/sim*100):0, ok=profit>=0;
  return `<tr>
    <td><span class="card-type ${c.type==="credit"?"card-credit":"card-debit"}">${c.type==="credit"?"신용":"체크"}</span></td>
    <td><input type="text" class="cell-input" style="font-weight:600" value="${escapeHtml(c.name)}" onchange="updVC('${c.id}','name',this.value)"></td>
    <td class="num"><input type="number" step="0.01" min="0" max="100" class="van-fee-input van-percent" value="${c.merchantRate}" onchange="updVC('${c.id}','merchantRate',this.value)"> %</td>
    <td class="num" style="color:#9333EA;font-weight:600">${fmt(Math.round(fee))}원</td>
    <td class="num"><input type="number" step="1" min="0" class="van-fee-input" style="color:#C53030;font-weight:600" value="${c.vanFee}" onchange="updVC('${c.id}','vanFee',this.value)"> 원</td>
    <td class="num ${ok?"van-profit":"van-loss"}">${ok?"+":""}${fmt(Math.round(profit))}원</td>
    <td class="num" style="color:${ok?"#0A7D3F":"#C53030"}">${rate.toFixed(2)}%</td>
    <td class="actions-cell"><button class="icon-btn del-btn" onclick="delVC('${c.id}')">×</button></td>
  </tr>`;
}
function renderVanFoot(cards,sim) {
  const calc=arr=>{
    if(!arr.length) return null;
    const ar=arr.reduce((s,c)=>s+c.merchantRate,0)/arr.length;
    const af=sim*ar/100, av=arr.reduce((s,c)=>s+c.vanFee,0)/arr.length;
    const ap=af-av, apr=sim>0?(ap/sim*100):0;
    return {ar,af,av,ap,apr};
  };
  const cr=calc(cards.filter(c=>c.type==="credit")), db=calc(cards.filter(c=>c.type==="debit"));
  const row=(label,s)=>s?`<tr><td colspan="2"><b>${label}</b></td>
    <td class="num"><b>${s.ar.toFixed(2)}%</b></td>
    <td class="num" style="color:#9333EA"><b>${fmt(Math.round(s.af))}원</b></td>
    <td class="num" style="color:#C53030"><b>${fmt(Math.round(s.av))}원</b></td>
    <td class="num ${s.ap>=0?"van-profit":"van-loss"}"><b>${s.ap>=0?"+":""}${fmt(Math.round(s.ap))}원</b></td>
    <td class="num"><b>${s.apr.toFixed(2)}%</b></td><td></td></tr>`:"";
  return `<tfoot>${row("신용카드 평균",cr)}${row("체크카드 평균",db)}</tfoot>`;
}
function simBlur(el) {
  const num=parseInt(el.value.replace(/[^\d]/g,""),10)||0;
  S.van.simAmount=num; el.value=fmt(num); saveVan(); render();
}
function updVC(id,field,value) {
  S.van.cards=S.van.cards.map(c=>{ if(c.id!==id) return c;
    let v=value; if(field==="merchantRate"||field==="vanFee") v=value===""?0:Number(value);
    return {...c,[field]:v}; });
  saveVan(); render();
}
function addVC(type) {
  const ord=(S.van.cards[S.van.cards.length-1]?.order||0)+1;
  S.van.cards=[...S.van.cards,{id:uid(),name:type==="credit"?"새 신용카드":"새 체크카드",type,merchantRate:type==="credit"?1.5:1.0,vanFee:113,order:ord}];
  saveVan(); render();
}
function delVC(id) {
  if(!confirm("이 카드사를 삭제하시겠습니까?")) return;
  S.van.cards=S.van.cards.filter(c=>c.id!==id); saveVan(); render();
}
function resetVan() {
  if(!confirm("VAN FEE 표를 초기 상태로 되돌리시겠습니까?")) return;
  S.van={cards:JSON.parse(JSON.stringify(INIT_VAN_CARDS)),simAmount:50000};
  saveVan(); render();
}
function exportVanCSV() {
  const sim=S.van.simAmount;
  const hdr=`구분,카드사,수수료율(%),결제수수료,VAN FEE,대리점이익,이익률(%)\n`;
  const body=S.van.cards.map(c=>{
    const fee=sim*c.merchantRate/100, profit=fee-c.vanFee;
    return `${c.type==="credit"?"신용":"체크"},${c.name},${c.merchantRate},${Math.round(fee)},${c.vanFee},${Math.round(profit)},${(sim>0?(profit/sim*100):0).toFixed(2)}`;
  }).join("\n");
  dl("\uFEFF"+hdr+body,"van_fee_"+todayISO()+".csv","text/csv;charset=utf-8;");
}

function setCalcBiz(id) { CALC.bizType=id; render(); }
function setCalcRate(v) { CALC.rateIdx=v===""?null:parseInt(v); render(); }
function setCalcRange(v) { CALC.rangeIdx=v===""?null:parseInt(v); render(); }
function renderCalcResult() {
  const area = document.getElementById("calc-result-area");
  if(!area) return;
  const vanFee = (CALC.rateIdx!==null && CALC.rangeIdx!==null) ? KSNET_TABLE[CALC.rangeIdx][CALC.rateIdx] : null;
  const vanFeeVat = vanFee ? Math.round(vanFee * 1.1) : null;
  const count = parseInt(CALC.monthlyCount)||0;
  const monthlyFee = vanFeeVat ? Math.round(vanFeeVat * count) : 0;
  if(vanFee===null) return;
  // 건수만 바뀔 때 결과 카드만 업데이트 (전체 렌더 없이)
  const valEls = area.querySelectorAll(".r-val");
  if(valEls.length >= 2) {
    valEls[1].textContent = count>0?fmt(count)+"건":"입력 필요";
    if(valEls[2]) valEls[2].textContent = count>0?fmt(monthlyFee)+"원":"—";
  }
}

function renderTodo() {
  const {filter,showAdd,form}=S.todo;
  const sorted=[...S.todos].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const o={high:0,mid:1,low:2}; if(a.priority!==b.priority) return o[a.priority]-o[b.priority];
    if(a.dueDate&&b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    return a.dueDate?-1:b.dueDate?1:0;
  });
  const filtered=sorted.filter(t=>filter==="active"?!t.done:filter==="done"?t.done:true);
  const ac=S.todos.filter(t=>!t.done).length, dc=S.todos.filter(t=>t.done).length;
  const oc=S.todos.filter(t=>!t.done&&t.dueDate&&t.dueDate<todayISO()).length;
  return `
    <div class="summary summary-3">
      <div class="stat"><span class="stat-label">진행중</span><span class="stat-val" style="color:#1A56DB;font-size:20px">${ac}건</span></div>
      <div class="stat" style="${oc>0?"border-color:#EF4444;background:#FEF2F2":""}">
        <span class="stat-label">지난 마감</span><span class="stat-val" style="color:${oc>0?"#C53030":"#64748B"};font-size:20px">${oc}건</span>
      </div>
      <div class="stat"><span class="stat-label">완료</span><span class="stat-val" style="color:#0A7D3F;font-size:20px">${dc}건</span></div>
    </div>
    <div class="toolbar">
      <button class="btn-primary" onclick="toggleAddTodo()">＋ 새 할일</button>
      <div class="filter-chips">
        <button class="chip ${filter==="active"?"active":""}" onclick="setTF('active')">진행중 <span class="chip-n">${ac}</span></button>
        <button class="chip ${filter==="done"?"active":""}" onclick="setTF('done')">완료 <span class="chip-n">${dc}</span></button>
        <button class="chip ${filter==="all"?"active":""}" onclick="setTF('all')">전체 <span class="chip-n">${S.todos.length}</span></button>
      </div>
    </div>
    ${showAdd?`<div class="add-card">
      <input class="add-title-input" id="todo-title" placeholder="할일 제목" value="${escapeHtml(form.title)}" oninput="S.todo.form.title=this.value" onkeydown="if(event.key==='Enter')addTodo()">
      <div class="add-meta">
        <div class="prio-picker">${Object.entries(TODO_PRIOS).map(([k,p])=>`
          <button class="prio-btn" style="${form.priority===k?`background:${p.bg};color:${p.color};border-color:${p.color}`:""}" onclick="setPrio('${k}')">${p.label}</button>
        `).join("")}</div>
        <input type="date" id="todo-date" class="add-date-input" value="${form.dueDate}" onchange="S.todo.form.dueDate=this.value">
        <input type="text" id="todo-memo" class="add-memo-input" placeholder="메모 (선택)" value="${escapeHtml(form.memo)}" oninput="S.todo.form.memo=this.value">
      </div>
      <div class="add-actions">
        <button class="btn-ghost" onclick="toggleAddTodo()">취소</button>
        <button class="btn-primary" onclick="addTodo()">추가</button>
      </div>
    </div>`:""}
    ${filtered.length===0?`<div class="empty-page"><div class="empty-icon">✓</div><h3>${filter==="active"?"할일이 없어요":filter==="done"?"완료한 항목 없음":"할일 없음"}</h3><p>+ 새 할일 버튼으로 추가하세요.</p></div>`:`
    <div class="todo-list">${filtered.map(t=>{
      const p=TODO_PRIOS[t.priority], ov=!t.done&&t.dueDate&&t.dueDate<todayISO();
      return `<div class="todo ${t.done?"done":""} ${ov?"overdue":""}">
        <button class="todo-check" style="${t.done?"background:#0A7D3F;border-color:#0A7D3F":""}" onclick="toggleDone('${t.id}')">${t.done?"✓":""}</button>
        <div class="todo-body"><div class="todo-head">
          <span class="todo-prio" style="background:${p.bg};color:${p.color}">${p.label}</span>
          <span class="todo-title">${escapeHtml(t.title)}</span>
          ${t.dueDate?`<span class="todo-due ${ov?"overdue":""}">📅 ${t.dueDate}${ov?" (지연)":""}</span>`:""}
        </div>${t.memo?`<div class="todo-memo">${escapeHtml(t.memo)}</div>`:""}</div>
        <button class="icon-btn del-btn" onclick="delTodo('${t.id}')">×</button>
      </div>`;
    }).join("")}</div>`}
  `;
}
function toggleAddTodo() {
  S.todo.showAdd=!S.todo.showAdd;
  if(!S.todo.showAdd) S.todo.form={title:"",priority:"mid",dueDate:"",memo:""};
  render(); if(S.todo.showAdd) setTimeout(()=>document.getElementById("todo-title")?.focus(),0);
}
function setPrio(p){ S.todo.form.priority=p; render(); }
function addTodo() {
  const titleEl=document.getElementById("todo-title");
  const dateEl=document.getElementById("todo-date");
  const memoEl=document.getElementById("todo-memo");
  const title=(titleEl?.value||S.todo.form.title||"").trim();
  if(!title){ alert("할일 제목을 입력하세요."); titleEl?.focus(); return; }
  S.todos=[...S.todos,{
    id:uid(),title,priority:S.todo.form.priority,
    dueDate:dateEl?.value||S.todo.form.dueDate||null,
    memo:memoEl?.value||S.todo.form.memo||"",
    done:false,createdAt:new Date().toISOString(),completedAt:null
  }];
  S.todo.form={title:"",priority:"mid",dueDate:"",memo:""}; S.todo.showAdd=false;
  saveTodos(); render();
}
function toggleDone(id) {
  S.todos=S.todos.map(t=>t.id===id?{...t,done:!t.done,completedAt:!t.done?new Date().toISOString():null}:t);
  saveTodos(); render();
}
function delTodo(id) {
  if(!confirm("삭제하시겠습니까?")) return;
  S.todos=S.todos.filter(t=>t.id!==id); saveTodos();
}
function setTF(f){ S.todo.filter=f; render(); }

function exportBackup() {
  const data={version:2,exportedAt:new Date().toISOString(),rows:S.rows,todos:S.todos,van:S.van};
  dl(JSON.stringify(data,null,2),"사업자장부_백업_"+todayISO()+".json","application/json");
  alert("백업 완료!");
}
function importBackup(input) {
  const file=input.files[0]; if(!file) return;
  if(!confirm("현재 데이터를 덮어쓰고 복원합니다. 계속하시겠습니까?")){ input.value=""; return; }
  const reader=new FileReader();
  reader.onload=async e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data.rows)) throw new Error("잘못된 백업 파일");
      S.rows=data.rows; S.todos=Array.isArray(data.todos)?data.todos:[];
      if(data.van?.cards) S.van=data.van;
      await Promise.all([
        set(ref(db,"cashbook/rows"),S.rows),
        set(ref(db,"cashbook/todos"),S.todos),
        set(ref(db,"cashbook/van"),S.van)
      ]);
      alert(`복원 완료! 거래 ${S.rows.length}건, 할일 ${S.todos.length}건`);
      closeModal();
    } catch(err){ alert("복원 실패: "+err.message); }
    input.value="";
  };
  reader.readAsText(file);
}

// ============ 시작 ============
initFirebase();
</script>
