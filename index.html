<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>사업자 장부</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:#FAFAF7;color:#1A1A1A;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
:root{--bg:#FAFAF7;--paper:#fff;--ink:#1A1A1A;--soft:#4A4A4A;--dim:#8A8A8A;--line:#E2E2DC;--lsoft:#F0F0EA;--accent:#1A56DB;--green:#0A7D3F;--red:#C53030;--hi:#FFF9E6}
.sync-bar{position:fixed;top:0;left:0;right:0;z-index:200;padding:7px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .3s}
.sync-bar.ok{background:#ECFDF5;color:#065F46;border-bottom:1px solid #A7F3D0}
.sync-bar.ing{background:#FFFBEB;color:#92400E;border-bottom:1px solid #FDE68A}
.sync-bar.err{background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FECACA}
.sdot{width:8px;height:8px;border-radius:50%}
.ok .sdot{background:#10B981}.ing .sdot{background:#F59E0B;animation:pulse 1s infinite}.err .sdot{background:#EF4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.root{min-height:100vh;padding:56px 20px 80px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.ltext{font-size:14px;color:var(--soft)}
@keyframes spin{to{transform:rotate(360deg)}}
header{max-width:1280px;margin:0 auto 18px}
.trow{margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.ttl{font-size:22px;font-weight:800;margin:0;letter-spacing:-0.02em}
.sub{font-size:12px;color:var(--soft);margin:3px 0 0}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:transparent;border:none;padding:9px 14px;color:var(--dim);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:5px}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.badge{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.summary{max-width:1280px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.s3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.smain{background:linear-gradient(135deg,#F0F4FF,#fff);border-color:#C8D6FF}
.slabel{font-size:11px;color:var(--soft);font-weight:500}
.sval{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.toolbar{max-width:1280px;margin:0 auto 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bp{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.bp:hover:not(:disabled){background:#1e4cbf}.bp:disabled{background:#94a3b8;cursor:not-allowed}
.bg{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit}
.bg:hover{background:var(--lsoft)}
select.sel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);font-family:inherit}
.srch{position:relative;flex:1;max-width:240px}
.srch input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 28px 8px 10px;font-size:13px;font-family:inherit}
.srch input:focus{outline:none;border-color:var(--accent)}
.xbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 5px}
.cnt{margin-left:auto;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.twrap{max-width:1280px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt thead th{background:#F5F5EF;border-bottom:2px solid var(--line);padding:9px 10px;text-align:left;font-weight:700;font-size:11px;color:var(--soft);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
table.dt thead th.r{text-align:right}
table.dt thead th.c{text-align:center}
table.dt tbody td{padding:0;border-bottom:1px solid var(--lsoft);background:var(--paper)}
table.dt tbody tr:hover td{background:#FAFAF5}
table.dt td.r{text-align:right;padding-right:10px;font-variant-numeric:tabular-nums}
table.dt tfoot td{background:#F5F5EF;border-top:2px solid var(--line);padding:9px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.ci{width:100%;border:none;background:transparent;padding:9px 10px;font-size:13px;font-family:inherit;color:var(--ink)}
.ci:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--hi)}
.nr{text-align:right;font-variant-numeric:tabular-nums}
.dc{color:var(--green);font-weight:600}.wc{color:var(--red);font-weight:600}
.bc{font-weight:700;padding:9px 10px}
.csel{width:100%;border:none;background:transparent;padding:9px 6px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink)}
.csel:focus{outline:2px solid var(--accent);outline-offset:-2px}
.csel:disabled{color:var(--dim);cursor:not-allowed}
.txcell{text-align:center;padding:0!important}
.txck{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:6px 4px;gap:2px}
.txck input{display:none}
.txbox{width:20px;height:20px;border:1.5px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;font-size:13px;font-weight:700;color:#fff;transition:all .1s}
.txck input:checked+.txbox{background:var(--accent);border-color:var(--accent)}
.txck input:disabled+.txbox{background:#F1F5F9;border-color:#E2E8F0}
.txhint{font-size:10px;color:var(--dim)}
.ac{text-align:right;padding-right:6px;white-space:nowrap}
.ib{background:transparent;border:none;color:var(--dim);cursor:pointer;width:26px;height:26px;border-radius:6px;font-size:14px;line-height:1;font-family:inherit}
.ib:hover{background:var(--lsoft);color:var(--ink)}
.ib.del:hover{background:#FFEBEA;color:var(--red)}
.ec{text-align:center;padding:50px 20px!important;color:var(--dim);font-size:13px}
.fhint{max-width:1280px;margin:12px auto 0;font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
/* 수수료 계산기 */
.panel{max-width:1280px;margin:0 auto 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.ptitle{font-size:14px;font-weight:700;margin:0 0 12px}
.cform{max-width:600px;margin:0 auto 18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.cform h3{font-size:16px;font-weight:700;margin:0 0 18px}
.cf{margin-bottom:14px}
.cf label{display:block;font-size:11px;font-weight:600;color:var(--soft);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1.5px solid var(--line);color:var(--soft);padding:6px 13px;border-radius:100px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.csel2{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--paper);cursor:pointer}
.csel2:focus{outline:none;border-color:var(--accent)}
.cinput{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--paper);text-align:right;font-variant-numeric:tabular-nums}
.cinput:focus{outline:none;border-color:var(--accent)}
.cresult{max-width:600px;margin:0 auto}
.rcard{background:linear-gradient(135deg,#1A56DB,#2563EB);border-radius:14px;padding:22px;color:#fff;margin-bottom:10px}
.rcard .rl{font-size:12px;opacity:.8;font-weight:500;margin-bottom:5px}
.rcard .rv{font-size:30px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.rcard .rs{font-size:13px;opacity:.75;margin-top:5px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ri{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ri .rl{font-size:11px;color:var(--dim);font-weight:500;margin-bottom:3px}
.ri .rv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.rnote{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:12px 14px;font-size:12px;color:#92400E;line-height:1.6;max-width:600px;margin:0 auto 12px}
.rtwrap{max-width:1280px;margin:18px auto 0}
.rtwrap h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--soft)}
.rtable{width:100%;border-collapse:collapse;font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rtable th{background:#1A56DB;color:#fff;padding:5px 7px;text-align:center;font-weight:600;white-space:nowrap}
.rtable th.dk{background:#1e3a5f}
.rtable td{padding:4px 7px;border-bottom:1px solid var(--lsoft);text-align:center;font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}
.rtable tr:last-child td{border-bottom:none}
.rtable td:first-child{text-align:left;font-weight:600;color:var(--ink);background:#F8F8F4;min-width:120px}
.rtable tr.hl td{background:#EFF6FF;color:var(--accent);font-weight:700}
.rtable tr.hl td:first-child{background:#DBEAFE}
/* 할일 */
.fchips{display:flex;gap:6px}
.fchip{background:var(--paper);border:1px solid var(--line);color:var(--soft);padding:6px 12px;border-radius:100px;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;display:flex;align-items:center;gap:5px}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.fchip .n{font-size:10px;padding:1px 5px;background:rgba(0,0,0,.08);border-radius:10px;font-variant-numeric:tabular-nums}
.fchip.on .n{background:rgba(255,255,255,.2)}
.acard{max-width:1280px;margin:0 auto 10px;background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:14px}
.ati{width:100%;border:none;background:transparent;font-size:16px;font-weight:600;padding:4px 0;color:var(--ink);outline:none;font-family:inherit}
.ameta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ppicker{display:flex;gap:4px}
.pbtn{background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--soft);font-weight:500;font-family:inherit}
.adi,.ami{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit}
.ami{flex:1;min-width:140px}
.aact{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--lsoft)}
.tdlist{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.td{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center}
.td:hover{border-color:#94a3b8}
.td.dn{opacity:.6;background:#FAFAF7}
.td.ov{border-left:3px solid var(--red)}
.tck{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:inherit}
.tck:hover{border-color:var(--accent)}
.tbody2{min-width:0}
.thead2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tprio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.ttitle{font-size:14px;font-weight:600;color:var(--ink)}
.td.dn .ttitle{text-decoration:line-through;color:var(--dim)}
.tdue{font-size:11px;color:var(--soft);background:var(--lsoft);padding:2px 7px;border-radius:4px}
.tdue.ov{background:#FEF2F2;color:var(--red);font-weight:600}
.tmemo{font-size:12px;color:var(--soft);margin-top:3px}
.epage{max-width:500px;margin:40px auto;text-align:center;background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:44px 28px}
.eicon{font-size:42px;margin-bottom:12px}
.epage h3{font-size:16px;font-weight:700;margin:0 0 5px}
.epage p{font-size:13px;color:var(--soft);margin:0}
/* 백업 모달 */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--paper);border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px}
.mhead h3{margin:0;font-size:17px;font-weight:700}
.mclose{background:var(--lsoft);border:none;color:var(--soft);font-size:17px;cursor:pointer;width:28px;height:28px;border-radius:50%;font-family:inherit}
.mbody{padding:0 20px 16px}
.mact{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--lsoft)}
.bsec{margin-bottom:16px}
.bsec h4{font-size:14px;font-weight:600;margin:0 0 5px}
.bsec p{font-size:13px;color:var(--soft);margin:0 0 8px;line-height:1.5}
.filabel{display:inline-block;padding:8px 14px;background:var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
input.fiinput{display:none}
/* 바텀 네비 */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:50;padding:4px 0 env(safe-area-inset-bottom)}
.bnavi{display:flex}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;background:transparent;border:none;cursor:pointer;font-size:10px;color:var(--dim);font-family:inherit}
.nbtn.on{color:var(--accent)}
.nbtn span:first-child{font-size:19px}
@media(max-width:768px){
  .root{padding:50px 12px 80px}
  .summary{grid-template-columns:1fr 1fr}
  .s3{grid-template-columns:1fr 1fr}
  table.dt{font-size:12px;min-width:650px}
  .twrap{overflow-x:auto}
  .srch{max-width:100%}
  nav.tabs{display:none}
  .bnav{display:block}
  .ttl{font-size:20px}
  .sval{font-size:16px}
  .rgrid{grid-template-columns:1fr}
}
</style>
</head>

const ST={};
function fbSave(path,data){
  clearTimeout(ST[path]);
  ST[path]=setTimeout(async function(){
    try{await set(ref(db,path),data);setSbar("ok");}
    catch(e){setSbar("err");console.error(e);}
  },400);
}
function saveRows(){fbSave("cashbook/rows",S.rows);}
function saveTodos(){fbSave("cashbook/todos",S.todos);}

function setSbar(st){
  var b=document.getElementById("sbar"),t=document.getElementById("stxt");
  if(!b||!t)return;
  b.className="sync-bar "+st;
  if(st==="ok")t.textContent="✓ 실시간 동기화 중";
  else if(st==="ing")t.textContent="Firebase 연결 중…";
  else t.textContent="오프라인 · 네트워크 연결을 확인하세요";
}

async function init(){
  try{
    var snap=await get(ref(db,"cashbook"));
    if(!snap.exists()){
      await set(ref(db,"cashbook/rows"),IV);
      await set(ref(db,"cashbook/todos"),[]);
    }
    onValue(ref(db,"cashbook/rows"),function(sn){
      S.rows=sn.val()?Object.values(sn.val()):[];
      render();
    });
    onValue(ref(db,"cashbook/todos"),function(sn){
      S.todos=sn.val()?Object.values(sn.val()):[];
      render();
    });
    setSbar("ok");
  }catch(e){
    setSbar("err");
    console.error(e);
    S.rows=IV;S.todos=[];
    render();
  }
}

function renderLedger(){
  var fm=S.ledger.fm,fc=S.ledger.fc,q=S.ledger.search;
  var sorted=[].concat(S.rows).sort(function(a,b){return(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id);});
  var run=0;
  var wb=sorted.map(function(r){run+=(r.deposit||0)-(r.withdraw||0);return Object.assign({},r,{balance:run});});
  var months=[...new Set(S.rows.map(function(r){return mk(r.date);}).filter(Boolean))].sort().reverse();
  var fil=wb.filter(function(r){
    if(fm!=="all"&&!(r.date||"").startsWith(fm))return false;
    if(fc!=="all"&&r.category!==fc)return false;
    if(q&&!(r.memo||"").toLowerCase().includes(q.toLowerCase()))return false;
    return true;
  });
  var td=fil.reduce(function(s,r){return s+(r.deposit||0);},0);
  var tw=fil.reduce(function(s,r){return s+(r.withdraw||0);},0);
  var cb=wb.length>0?wb[wb.length-1].balance:0;
  var tp=S.rows.filter(function(r){return(r.deposit||r.withdraw)&&!r.taxInvoice;}).length;
  var mOpts=months.map(function(m){return'<option value="'+m+'" '+(fm===m?"selected":"")+'>'+m.replace("-",".")+'월</option>';}).join("");
  var dOpts=DC.map(function(c){return'<option value="'+c.id+'" '+(fc===c.id?"selected":"")+'>'+c.label+"</option>";}).join("");
  var wOpts=WC.map(function(c){return'<option value="'+c.id+'" '+(fc===c.id?"selected":"")+'>'+c.label+"</option>";}).join("");
  var rows=fil.length===0?'<tr><td colspan="8" class="ec">'+(S.rows.length===0?"거래 내역이 없습니다.":"조건에 맞는 거래가 없습니다.")+"</td></tr>":fil.map(renderRow).join("");
  var foot=fil.length>0?'<tfoot><tr><td><b>소계</b></td><td class="r" style="color:#0A7D3F"><b>'+fmt(td)+'</b></td><td class="r" style="color:#C53030"><b>'+fmt(tw)+'</b></td><td class="r"><b>'+fmt(td-tw)+"</b></td><td colspan='4'></td></tr></tfoot>":"";
  return '<div class="summary"><div class="stat"><span class="slabel">총 입금</span><span class="sval" style="color:#0A7D3F">+'+fmt(td)+'원</span></div><div class="stat"><span class="slabel">총 출금</span><span class="sval" style="color:#C53030">-'+fmt(tw)+'원</span></div><div class="stat smain"><span class="slabel">현재 잔액</span><span class="sval" style="color:'+(cb>=0?"#1A56DB":"#C53030")+'">'+fmt(cb)+'원</span></div><div class="stat" style="'+(tp>0?"border-color:#F59E0B;background:#FFFBEB":"")+'"><span class="slabel">세금계산서 미처리</span><span class="sval" style="color:'+(tp>0?"#D97706":"#64748B")+';font-size:16px">'+tp+'건</span></div></div>'
    +'<div class="toolbar"><button class="bp" onclick="addRow()">＋ 새 거래</button><select class="sel" onchange="setFM(this.value)"><option value="all" '+(fm==="all"?"selected":"")+'">전체 기간</option>'+mOpts+'</select><select class="sel" onchange="setFC(this.value)"><option value="all" '+(fc==="all"?"selected":"")+'>전체 카테고리</option><optgroup label="입금">'+dOpts+'</optgroup><optgroup label="출금">'+wOpts+'</optgroup></select><div class="srch"><input placeholder="비고 검색…" value="'+esc(q)+'" oninput="setQ(this.value)">'+(q?'<button class="xbtn" onclick="setQ(\'\')">×</button>':"")+'</div><button class="bg" onclick="expCSV()">📥 CSV</button><div class="cnt">'+fil.length+'건</div></div>'
    +'<div class="twrap"><table class="dt"><thead><tr><th style="width:110px">날짜</th><th class="r" style="width:110px">입금</th><th class="r" style="width:110px">출금</th><th class="r" style="width:110px">잔액</th><th style="width:110px">카테고리</th><th class="c" style="width:70px">세금계산서</th><th>비고</th><th style="width:60px"></th></tr></thead><tbody>'+rows+"</tbody>"+foot+"</table></div>"
    +'<div class="fhint">💡 세금계산서: 입금 시 <b>발행여부</b>, 출금 시 <b>수신여부</b></div>';

function renderRow(r){
  var isD=!!r.deposit,isW=!!r.withdraw;
  var cl=isD?DC:isW?WC:[];
  var cat=AC.find(function(c){return c.id===r.category;});
  var cOpts='<option value="">미분류</option>'+cl.map(function(c){return'<option value="'+c.id+'" '+(r.category===c.id?"selected":"")+'>'+c.label+"</option>";}).join("");
  return '<tr><td><input type="date" class="ci" style="color-scheme:light" value="'+(r.date||"")+'" onchange="updR(\''+r.id+'\',\'date\',this.value)"></td>'
    +'<td class="r"><input type="text" inputmode="numeric" class="ci nr dc" value="'+(r.deposit!=null?fmt(r.deposit):"")+'" placeholder="-" onfocus="nf(this)" onblur="nb(this,\''+r.id+'\',\'deposit\')" oninput="ni(this)"></td>'
    +'<td class="r"><input type="text" inputmode="numeric" class="ci nr wc" value="'+(r.withdraw!=null?fmt(r.withdraw):"")+'" placeholder="-" onfocus="nf(this)" onblur="nb(this,\''+r.id+'\',\'withdraw\')" oninput="ni(this)"></td>'
    +'<td class="r bc" style="color:'+(r.balance>=0?"#1A56DB":"#C53030")+'">'+fmt(r.balance)+"</td>"
    +'<td><select class="csel" '+(cat?'style="color:'+cat.color+';font-weight:600"':"")+' '+((!isD&&!isW)?"disabled":"")+' onchange="updR(\''+r.id+'\',\'category\',this.value)">'+cOpts+"</select></td>"
    +'<td class="txcell"><label class="txck"><input type="checkbox" '+(r.taxInvoice?"checked":"")+' '+((!isD&&!isW)?"disabled":"")+' onchange="updR(\''+r.id+'\',\'taxInvoice\',this.checked)"><span class="txbox">'+(r.taxInvoice?"✓":"")+'</span><span class="txhint">'+(isD?"발행":isW?"수신":"—")+"</span></label></td>"
    +'<td><input type="text" class="ci" value="'+esc(r.memo||"")+'" placeholder="메모…" onchange="updR(\''+r.id+'\',\'memo\',this.value)"></td>'
    +'<td class="ac"><button class="ib" onclick="dupR(\''+r.id+'\')">⎘</button><button class="ib del" onclick="delR(\''+r.id+'\')">×</button></td></tr>';
}
window.nf=function(el){el.value=el.value.replace(/,/g,"");el.select();};
window.ni=function(el){el.value=el.value.replace(/[^\d]/g,"");};
window.nb=function(el,id,f){var raw=el.value.replace(/[^\d]/g,"");var n=raw===""?null:parseInt(raw,10);el.value=n!=null?fmt(n):"";updR(id,f,n);};
window.updR=function(id,f,v){S.rows=S.rows.map(function(r){if(r.id!==id)return r;var val=v;if(f==="deposit"||f==="withdraw")val=(v===""||v==null)?null:Number(v);else if(f==="category")val=(v==="")?null:v;return Object.assign({},r,{[f]:val});});saveRows();};

window.dupR=function(id){var t=S.rows.find(function(r){return r.id===id;});if(!t)return;S.rows=[].concat(S.rows,[Object.assign({},t,{id:uid()})]);saveRows();render();};
window.setFM=function(v){S.ledger.fm=v;render();};
window.setFC=function(v){S.ledger.fc=v;render();};

window.expCSV=function(){
  var sorted=[].concat(S.rows).sort(function(a,b){return(a.date||"").localeCompare(b.date||"");});
  var run=0;var wb=sorted.map(function(r){run+=(r.deposit||0)-(r.withdraw||0);return Object.assign({},r,{balance:run});});
  var hdr="날짜,입금,출금,잔액,카테고리,세금계산서,비고\n";
  var body=wb.map(function(r){var cat=AC.find(function(c){return c.id===r.category;});return r.date+","+(r.deposit||0)+","+(r.withdraw||0)+","+r.balance+","+(cat?cat.label:"")+","+(r.taxInvoice?"처리완":"미처리")+',"'+(r.memo||"").replace(/"/g,'""')+'"';}).join("\n");
  dl("\uFEFF"+hdr+body,"cashbook_"+today()+".csv","text/csv;charset=utf-8;");
};

/* ── 수수료 계산기 ──────────────────────── */
function renderCalc(){
  var c=S.calc;
  var vanFee=(c.rateIdx!==null&&c.rangeIdx!==null)?KT[c.rangeIdx][c.rateIdx]:null;
  var vanVat=vanFee?Math.round(vanFee*1.1):null;
  var cnt=parseInt(c.count)||0;
  var monthly=vanVat?Math.round(vanVat*cnt):0;
  var rOpts=KRT.map(function(r,i){return'<option value="'+i+'" '+(c.rateIdx===i?"selected":"")+'>'+r+"</option>";}).join("");
  var rnOpts=KR.map(function(r,i){return'<option value="'+i+'" '+(c.rangeIdx===i?"selected":"")+'>'+r+"원</option>";}).join("");
  var result="";
  if(vanFee===null){
    result='<div style="max-width:600px;margin:0 auto;text-align:center;padding:36px 20px;color:var(--dim);font-size:13px">② 수수료율과 ③ 객단가 구간을 선택하면 자동 계산됩니다</div>';
  }else{
    result='<div class="cresult">'
      +'<div class="rcard"><div class="rl">건당 VAN FEE (VAT 포함)</div><div class="rv">'+fmt(vanVat)+'원</div><div class="rs">VAT 별도 '+fmt(Math.round(vanFee*10)/10)+'원 × 1.1 = '+fmt(vanVat)+'원</div></div>'
      +'<div class="rgrid">'
      +'<div class="ri"><div class="rl">월 예상 건수</div><div class="rv" style="color:var(--accent)">'+(cnt>0?fmt(cnt)+"건":"입력 필요")+'</div></div>'
      +'<div class="ri"><div class="rl">월 VAN FEE 합계</div><div class="rv" style="color:'+(cnt>0?"var(--green)":"var(--dim)")+'">'+(cnt>0?fmt(monthly)+"원":"—")+'</div></div>'
      +'<div class="ri"><div class="rl">선택 수수료율</div><div class="rv" style="color:#9333EA">'+KRT[c.rateIdx]+'</div></div>'
      +'<div class="ri"><div class="rl">선택 객단가 구간</div><div class="rv" style="font-size:14px">'+KR[c.rangeIdx]+'원</div></div>'
      +'</div>'
      +(cnt>0?'<div class="rgrid"><div class="ri"><div class="rl">연간 예상</div><div class="rv" style="color:var(--green)">'+fmt(monthly*12)+'원</div></div><div class="ri"><div class="rl">일평균 (30일)</div><div class="rv">'+fmt(Math.round(monthly/30))+'원</div></div></div>':"")
      +'</div>';
    result+='<div class="rnote">📌 <b>라인 VAN 수수료 테이블 기준</b> (KSNET, VAT 별도)<br>• 신용/체크 구분 없이 발생월(D)+1개월 말일 일시 지급<br>• 1,000원 미만 승인 건 수수료 미지급<br>• 전표용지 지급, 현금영수증: 건당 5원 별도</div>';
  }
  var tHead='<tr><th class="dk" rowspan="2">객단가 구간</th><th colspan="'+KRT.length+'">가맹점 카드사 수수료율 (신용/체크 월 평균)</th></tr><tr>'+KRT.map(function(r,i){return'<th '+(i===c.rateIdx?'style="background:#FCD34D;color:#1A1A1A"':"")+'>'+r+"</th>";}).join("")+"</tr>";
  var tBody=KT.map(function(row,ri){return'<tr class="'+(ri===c.rangeIdx?"hl":"")+'"><td>'+KR[ri]+'원</td>'+row.map(function(v,ci){return'<td '+(ri===c.rangeIdx&&ci===c.rateIdx?'style="background:#FCD34D;color:#1A1A1A;font-weight:800"':"")+'>'+v+"</td>";}).join("")+"</tr>";}).join("");
  return '<div class="cform"><h3>🧮 KSNET 라인 VAN 수수료 계산기</h3>'
    +'<div class="cf"><label>① 수수료율 (신용/체크 월 평균 MDR)</label><select class="csel2" onchange="setCR(this.value)"><option value="">-- 수수료율 선택 --</option>'+rOpts+"</select></div>"
    +'<div class="cf"><label>② 객단가 구간 (월 평균 객단가)</label><select class="csel2" onchange="setCRn(this.value)"><option value="">-- 객단가 구간 선택 --</option>'+rnOpts+"</select></div>"
    +'<div class="cf"><label>③ 월 예상 승인 건수</label><input type="number" class="cinput" placeholder="예: 500" value="'+esc(c.count)+'" onchange="setCnt(this.value)" inputmode="numeric"></div>'
    +"</div>"+result
    +'<div class="rtwrap" style="margin-top:0;margin-bottom:18px"><h3>📋 2025년 가맹점 우대수수료율 (2025.2.14 기준)</h3><table class="rtable" style="max-width:420px"><thead><tr><th class="dk" colspan="2">연매출 구간</th><th>신용카드</th><th>체크카드</th></tr></thead><tbody><tr><td>영세</td><td>3억원 이하</td><td style="color:#0A7D3F;font-weight:700">0.40%</td><td style="color:#0891B2;font-weight:700">0.15%</td></tr><tr><td rowspan="3">중소</td><td>3~5억원</td><td style="color:#0A7D3F;font-weight:700">1.00%</td><td style="color:#0891B2;font-weight:700">0.75%</td></tr><tr><td>5~10억원</td><td style="color:#0A7D3F;font-weight:700">1.15%</td><td style="color:#0891B2;font-weight:700">0.90%</td></tr><tr><td>10~30억원</td><td style="color:#0A7D3F;font-weight:700">1.45%</td><td style="color:#0891B2;font-weight:700">1.15%</td></tr></tbody></table><div style="font-size:11px;color:var(--dim);margin-top:6px">※ 연매출 30억 초과 일반가맹점은 카드사 개별 협의 (통상 1.5~2.5%)</div></div>'
    +'<div class="rtwrap"><h3>📊 KSNET 라인 VAN 수수료 전체 테이블 (단위: 원, VAT 별도)</h3><div style="overflow-x:auto"><table class="rtable"><thead>'+tHead+"</thead><tbody>"+tBody+"</tbody></table></div></div>";
}
window.setCR=function(v){S.calc.rateIdx=v===""?null:parseInt(v);render();};
window.setCRn=function(v){S.calc.rangeIdx=v===""?null:parseInt(v);render();};
window.setCnt=function(v){S.calc.count=v;render();};

/* ── 할일 ───────────────────────────────── */
function renderTodo(){
  var fil=S.todo.filter,showAdd=S.todo.showAdd,form=S.todo.form;
  var sorted=[].concat(S.todos).sort(function(a,b){
    if(a.done!==b.done)return a.done?1:-1;
    var o={high:0,mid:1,low:2};if(a.priority!==b.priority)return o[a.priority]-o[b.priority];
    if(a.dueDate&&b.dueDate)return a.dueDate.localeCompare(b.dueDate);
    return a.dueDate?-1:b.dueDate?1:0;
  });
  var filtered=sorted.filter(function(t){return fil==="active"?!t.done:fil==="done"?t.done:true;});
  var ac=S.todos.filter(function(t){return!t.done;}).length;
  var dc=S.todos.filter(function(t){return t.done;}).length;
  var oc=S.todos.filter(function(t){return!t.done&&t.dueDate&&t.dueDate<today();}).length;
  var addCard=showAdd?'<div class="acard"><input class="ati" id="tti" placeholder="할일 제목" value="'+esc(form.title)+'" oninput="S.todo.form.title=this.value" onkeydown="if(event.key===\'Enter\')addTodo()"><div class="ameta"><div class="ppicker">'+Object.entries(TP).map(function(e){var k=e[0],p=e[1];return'<button class="pbtn" style="'+(form.priority===k?"background:"+p.bg+";color:"+p.color+";border-color:"+p.color:"")+'" onclick="setPrio(\''+k+'\')">'+p.label+"</button>";}).join("")+'</div><input type="date" id="tdi" class="adi" value="'+esc(form.dueDate)+'" onchange="S.todo.form.dueDate=this.value"><input type="text" id="tmi" class="ami" placeholder="메모(선택)" value="'+esc(form.memo)+'" oninput="S.todo.form.memo=this.value"></div><div class="aact"><button class="bg" onclick="togAdd()">취소</button><button class="bp" onclick="addTodo()">추가</button></div></div>':"";
  var tdHtml=filtered.length===0?'<div class="epage"><div class="eicon">✓</div><h3>'+(fil==="active"?"할일이 없어요":fil==="done"?"완료한 항목 없음":"할일 없음")+'</h3><p>+ 새 할일 버튼으로 추가하세요.</p></div>':'<div class="tdlist">'+filtered.map(function(t){var p=TP[t.priority],ov=!t.done&&t.dueDate&&t.dueDate<today();return'<div class="td '+(t.done?"dn":"")+" "+(ov?"ov":"")+'"><button class="tck" style="'+(t.done?"background:#0A7D3F;border-color:#0A7D3F":"")+'" onclick="togDone(\''+t.id+'\')">'+(t.done?"✓":"")+'</button><div class="tbody2"><div class="thead2"><span class="tprio" style="background:'+p.bg+";color:"+p.color+'">'+p.label+'</span><span class="ttitle">'+esc(t.title)+'</span>'+(t.dueDate?'<span class="tdue '+(ov?"ov":"")+'">📅 '+t.dueDate+(ov?" (지연)":"")+"</span>":"")+'</div>'+(t.memo?'<div class="tmemo">'+esc(t.memo)+"</div>":"")+"</div>"+'<button class="ib del" onclick="delTodo(\''+t.id+'\')">×</button></div>';}).join("")+"</div>";
  return '<div class="summary s3"><div class="stat"><span class="slabel">진행중</span><span class="sval" style="color:#1A56DB;font-size:18px">'+ac+'건</span></div><div class="stat" style="'+(oc>0?"border-color:#EF4444;background:#FEF2F2":"")+'"><span class="slabel">지난 마감</span><span class="sval" style="color:'+(oc>0?"#C53030":"#64748B")+';font-size:18px">'+oc+'건</span></div><div class="stat"><span class="slabel">완료</span><span class="sval" style="color:#0A7D3F;font-size:18px">'+dc+'건</span></div></div>'
    +'<div class="toolbar"><button class="bp" onclick="togAdd()">＋ 새 할일</button><div class="fchips"><button class="fchip '+(fil==="active"?"on":"")+'" onclick="setTF(\'active\')">진행중 <span class="n">'+ac+'</span></button><button class="fchip '+(fil==="done"?"on":"")+'" onclick="setTF(\'done\')">완료 <span class="n">'+dc+'</span></button><button class="fchip '+(fil==="all"?"on":"")+'" onclick="setTF(\'all\')">전체 <span class="n">'+S.todos.length+'</span></button></div></div>'
    +addCard+tdHtml;
}
window.togAdd=function(){S.todo.showAdd=!S.todo.showAdd;if(!S.todo.showAdd)S.todo.form={title:"",priority:"mid",dueDate:"",memo:""};render();if(S.todo.showAdd)setTimeout(function(){var el=document.getElementById("tti");if(el)el.focus();},0);};
window.setPrio=function(p){S.todo.form.priority=p;render();};
window.addTodo=function(){
  var te=document.getElementById("tti"),de=document.getElementById("tdi"),me=document.getElementById("tmi");
  var title=((te?te.value:S.todo.form.title)||"").trim();
  if(!title){alert("할일 제목을 입력하세요.");if(te)te.focus();return;}
  S.todos=[].concat(S.todos,[{id:uid(),title:title,priority:S.todo.form.priority,dueDate:(de?de.value:S.todo.form.dueDate)||null,memo:me?me.value:S.todo.form.memo,done:false,createdAt:new Date().toISOString(),completedAt:null}]);
  S.todo.form={title:"",priority:"mid",dueDate:"",memo:""};S.todo.showAdd=false;
  saveTodos();render();
};
window.togDone=function(id){S.todos=S.todos.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done,completedAt:!t.done?new Date().toISOString():null}):t;});saveTodos();render();};
window.delTodo=function(id){if(!confirm("삭제하시겠습니까?"))return;S.todos=S.todos.filter(function(t){return t.id!==id;});saveTodos();};
window.setTF=function(f){S.todo.filter=f;render();};

/* ── 백업 ───────────────────────────────── */
window.openBackup=function(){S.modal="backup";render();};
window.closeModal=function(){S.modal=null;render();};
function renderBackup(){
  return'<div class="mbg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="mhead"><h3>💾 백업 · 복원</h3><button class="mclose" onclick="closeModal()">×</button></div><div class="mbody"><div class="bsec"><h4>📥 백업 다운로드</h4><p>모든 데이터를 JSON으로 저장합니다.</p><button class="bp" onclick="expBackup()">백업 파일 다운로드</button></div><div class="bsec"><h4>📤 백업 복원</h4><p>JSON 파일로 복원합니다. <b style="color:#C53030">⚠ 현재 데이터가 덮어씌워집니다.</b></p><label class="filabel">파일 선택<input type="file" class="fiinput" accept=".json" onchange="impBackup(this)"></label></div><div class="bsec"><h4>📄 CSV 내보내기</h4><p>거래내역만 CSV로 내보냅니다.</p><button class="bg" onclick="expCSV()">CSV 다운로드</button></div></div><div class="mact"><button class="bg" onclick="closeModal()">닫기</button></div></div></div>';
}
window.expBackup=function(){dl(JSON.stringify({version:3,exportedAt:new Date().toISOString(),rows:S.rows,todos:S.todos},null,2),"사업자장부_백업_"+today()+".json","application/json");alert("백업 완료!");};
window.impBackup=function(input){
  var f=input.files[0];if(!f)return;
  if(!confirm("복원하시겠습니까? 현재 데이터가 덮어씌워집니다.")){input.value="";return;}
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!Array.isArray(data.rows))throw new Error("잘못된 백업 파일");
      S.rows=data.rows;S.todos=Array.isArray(data.todos)?data.todos:[];
      await Promise.all([set(ref(db,"cashbook/rows"),S.rows),set(ref(db,"cashbook/todos"),S.todos)]);
      alert("복원 완료! 거래 "+S.rows.length+"건, 할일 "+S.todos.length+"건");
      closeModal();
    }catch(err){alert("복원 실패: "+err.message);}
    input.value="";
  };
  reader.readAsText(f);
};
function dl(content,name,type){var b=new Blob([content],{type:type});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

init();
</script>
</body>
</html>
