<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사업자장부">
<title>사업자장부</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Pretendard Variable',Pretendard,-apple-system,'맑은 고딕','Malgun Gothic',sans-serif;background:#F7F7F7;color:#1A1A1A;font-size:14px;-webkit-font-smoothing:antialiased}
:root{--green:#03C75A;--green2:#00AC53;--green-bg:#E9FAF0;--blue:#1A73E8;--red:#E03030;--orange:#FF6B00;--ink:#1A1A1A;--soft:#505050;--dim:#888;--line:#E5E5E5;--line2:#D0D0D0;--bg:#F7F7F7;--paper:#fff;--nav-bg:#fff;--hover:#F2F2F2}

/* ── 상단 헤더 (네이버 상단바 스타일) ── */
.topbar{background:var(--paper);border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;z-index:200}
.topbar-inner{max-width:1080px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{width:32px;height:32px;background:var(--green);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:-1px}
.logo-text{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--dim);margin-top:1px}
.sync-pill{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:2px;font-size:12px;font-weight:600;border:1px solid}
.sync-pill.ok{background:#E9FAF0;color:#00AC53;border-color:#B2EAC9}
.sync-pill.ing{background:#FFF8E1;color:#FF8F00;border-color:#FFD54F}
.sync-pill.err{background:#FFEBEE;color:#D32F2F;border-color:#FFCDD2}
.sync-dot{width:7px;height:7px;border-radius:50%}
.sync-pill.ok .sync-dot{background:#00AC53}
.sync-pill.ing .sync-dot{background:#FF8F00;animation:blink 1s infinite}
.sync-pill.err .sync-dot{background:#D32F2F}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn-backup{background:transparent;border:1px solid var(--line2);color:var(--soft);padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;border-radius:2px}
.btn-backup:hover{background:var(--hover)}

/* ── 탭 네비 (네이버 탭 스타일) ── */
.tabnav{background:var(--paper);border-bottom:2px solid var(--line);position:fixed;top:56px;left:0;right:0;z-index:190}
.tabnav-inner{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;overflow-x:auto}
.tabnav-inner::-webkit-scrollbar{display:none}
.tabitem{background:transparent;border:none;padding:0 18px;height:44px;color:var(--dim);font-size:14px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:5px}
.tabitem:hover{color:var(--ink)}
.tabitem.on{color:var(--green);border-bottom-color:var(--green);font-weight:700}
.nbadge{background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:700}

/* ── 메인 레이아웃 ── */
.main{max-width:1080px;margin:0 auto;padding:116px 16px 80px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;background:var(--bg)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
.ltext{font-size:13px;color:var(--dim)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 섹션 박스 (네이버 컨텐츠 박스) ── */
.box{background:var(--paper);border:1px solid var(--line);margin-bottom:10px}
.box-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.box-title{font-size:14px;font-weight:700;color:var(--ink)}
.box-body{padding:16px}

/* ── KPI 카드 (네이버 통계 스타일) ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:10px}
.kpi{background:var(--paper);padding:16px 18px}
.kpi-label{font-size:12px;color:var(--dim);margin-bottom:6px}
.kpi-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:3px}

/* ── 툴바 ── */
.toolbar{display:flex;align-items:center;gap:6px;padding:10px 0;flex-wrap:wrap}
.btn-green{background:var(--green);color:#fff;border:none;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:2px}
.btn-green:hover{background:var(--green2)}
.btn-line{background:#fff;color:var(--ink);border:1px solid var(--line2);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;border-radius:2px}
.btn-line:hover{background:var(--hover)}
.btn-red{background:#fff;color:var(--red);border:1px solid var(--line2);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;border-radius:2px}
select.nsel{background:#fff;border:1px solid var(--line2);padding:6px 10px;font-size:12px;color:var(--ink);font-family:inherit;border-radius:2px}
.nsrch{position:relative}
.nsrch input{background:#fff;border:1px solid var(--line2);border-radius:2px;padding:6px 28px 6px 10px;font-size:12px;font-family:inherit;width:200px}
.nsrch input:focus{outline:none;border-color:var(--green)}
.xbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:14px}
.ml-auto{margin-left:auto}
.cnt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ── 테이블 (네이버 테이블 스타일) ── */
.ntable-wrap{border:1px solid var(--line);overflow:auto}
table.nt{width:100%;border-collapse:collapse;font-size:13px}
table.nt thead th{background:#F5F5F5;border-bottom:2px solid var(--line2);padding:9px 10px;text-align:left;font-size:12px;font-weight:700;color:var(--soft);white-space:nowrap}
table.nt thead th.r{text-align:right}
table.nt thead th.c{text-align:center}
table.nt tbody td{border-bottom:1px solid var(--line);padding:0;background:#fff}
table.nt tbody tr:hover td{background:#FAFFF7}
table.nt td.r{text-align:right;padding-right:10px;font-variant-numeric:tabular-nums}
table.nt tfoot td{background:#F5F5F5;border-top:2px solid var(--line2);padding:9px 10px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.ci{width:100%;border:none;background:transparent;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink)}
.ci:focus{outline:2px solid var(--green);outline-offset:-2px;background:#F0FFF6}
.nr{text-align:right;font-variant-numeric:tabular-nums}
.dc{color:#0A7D3F;font-weight:600}.wc{color:var(--red);font-weight:600}
.bc{font-weight:700;padding:8px 10px;font-variant-numeric:tabular-nums}
.csel{width:100%;border:none;background:transparent;padding:8px 6px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink)}
.csel:focus{outline:2px solid var(--green);outline-offset:-2px}
.csel:disabled{color:var(--dim);cursor:not-allowed}
.txcell{text-align:center;padding:0!important}
.txck{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:6px 4px;gap:2px}
.txck input{display:none}
.txbox{width:18px;height:18px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;background:#fff;font-size:12px;font-weight:700;color:#fff;border-radius:2px;transition:all .1s}
.txck input:checked+.txbox{background:var(--green);border-color:var(--green)}
.txck input:disabled+.txbox{background:#F0F0F0;border-color:var(--line)}
.txhint{font-size:10px;color:var(--dim)}
.ac{text-align:right;padding-right:6px;white-space:nowrap}
.ib{background:transparent;border:1px solid transparent;color:var(--dim);cursor:pointer;width:24px;height:24px;font-size:13px;line-height:1;font-family:inherit;border-radius:2px}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.del:hover{background:#FFEBEE;color:var(--red)}
.ec{text-align:center;padding:48px 20px!important;color:var(--dim);font-size:13px}
.hint{font-size:11px;color:var(--dim);padding:8px 0;line-height:1.6;text-align:center}

/* ── 수수료 계산기 ── */
.calc-section{background:var(--paper);border:1px solid var(--line);margin-bottom:10px;padding:20px}
.calc-section h3{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--green);display:inline-block}
.calc-field{margin-bottom:14px;display:grid;grid-template-columns:140px 1fr;align-items:center;gap:12px}
.calc-field label{font-size:13px;font-weight:600;color:var(--soft)}
.calc-select{width:100%;padding:8px 10px;border:1px solid var(--line2);font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border-radius:2px}
.calc-select:focus{outline:none;border-color:var(--green)}
.calc-input{width:100%;padding:8px 10px;border:1px solid var(--line2);font-size:13px;font-family:inherit;color:var(--ink);background:#fff;text-align:right;font-variant-numeric:tabular-nums;border-radius:2px}
.calc-input:focus{outline:none;border-color:var(--green)}
.result-area{margin-bottom:10px}
.result-main{background:#03C75A;color:#fff;padding:20px 22px;margin-bottom:1px}
.result-main .rl{font-size:12px;opacity:.85;margin-bottom:4px;font-weight:500}
.result-main .rv{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.result-main .rs{font-size:12px;opacity:.75;margin-top:4px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.ri{background:var(--paper);padding:13px 16px}
.ri .rl{font-size:11px;color:var(--dim);margin-bottom:4px}
.ri .rv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.result-note{background:#F5F5F5;border-left:3px solid var(--green);padding:10px 14px;font-size:12px;color:var(--soft);line-height:1.7;margin-top:10px}

/* 우대수수료 표 */
.mdr-table{width:100%;border-collapse:collapse;font-size:13px;max-width:480px}
.mdr-table th{background:#F0F0F0;border:1px solid var(--line2);padding:8px 14px;font-size:12px;font-weight:700;text-align:center;color:var(--soft)}
.mdr-table td{border:1px solid var(--line2);padding:8px 14px;text-align:center}
.mdr-table td:first-child{background:#FAFAFA;font-weight:600;text-align:left}
.mdr-table td:nth-child(2){background:#FAFAFA;text-align:left}
.mdr-table .tcredit{color:#0A7D3F;font-weight:700}
.mdr-table .tcheck{color:#0891B2;font-weight:700}

/* KSNET 전체 테이블 */
.ksnet-wrap{overflow-x:auto;border:1px solid var(--line)}
.ksnet-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.ksnet-table th{background:#1A6A3A;color:#fff;padding:6px 8px;text-align:center;font-weight:600}
.ksnet-table th.dk{background:#0F4225}
.ksnet-table td{padding:5px 8px;border-bottom:1px solid #F0F0F0;text-align:center;font-variant-numeric:tabular-nums;color:var(--soft)}
.ksnet-table td:first-child{text-align:left;font-weight:600;color:var(--ink);background:#F9F9F9;min-width:120px}
.ksnet-table tr:hover td{background:#F0FFF6}
.ksnet-table tr.hl td{background:#E9FAF0;color:#0A7D3F;font-weight:700}
.ksnet-table tr.hl td:first-child{background:#D4F0E0}
.ksnet-table td.sel-cell{background:#FFF3CD!important;color:#856404!important;font-weight:800!important}

/* ── 할일 ── */
.todo-filters{display:flex;gap:0;border:1px solid var(--line2);display:inline-flex}
.todo-filter-btn{background:#fff;border:none;border-right:1px solid var(--line2);padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--dim);display:flex;align-items:center;gap:4px}
.todo-filter-btn:last-child{border-right:none}
.todo-filter-btn.on{background:var(--green);color:#fff;font-weight:600}
.todo-filter-btn .n{font-size:10px;padding:0 4px;background:rgba(0,0,0,.1);border-radius:6px;font-variant-numeric:tabular-nums}
.todo-filter-btn.on .n{background:rgba(255,255,255,.25)}
.add-form{background:#F0FFF6;border:1px solid #B2EAC9;padding:14px 16px;margin-bottom:8px}
.add-form input.ati{width:100%;border:1px solid var(--line2);padding:8px 10px;font-size:14px;font-weight:600;font-family:inherit;color:var(--ink);border-radius:2px}
.add-form input.ati:focus{outline:none;border-color:var(--green)}
.add-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.ppicker{display:flex;gap:0;border:1px solid var(--line2)}
.pbtn{background:#fff;border:none;border-right:1px solid var(--line2);padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--dim)}
.pbtn:last-child{border-right:none}
.pbtn.on{font-weight:700}
.adi,.ami{border:1px solid var(--line2);padding:6px 10px;font-size:12px;font-family:inherit;border-radius:2px}
.ami{flex:1;min-width:140px}
.add-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.todo-list{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.todo-item{background:#fff;padding:12px 14px;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.todo-item:hover{background:#FAFFF7}
.todo-item.dn{background:#F7F7F7}
.todo-item.ov{border-left:3px solid var(--red)}
.tck{width:20px;height:20px;border:2px solid var(--line2);background:#fff;cursor:pointer;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:inherit;border-radius:2px;flex-shrink:0}
.tck:hover{border-color:var(--green)}
.tbody2{min-width:0}
.thead2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tprio{font-size:11px;font-weight:700;padding:1px 7px;border-radius:2px}
.ttitle{font-size:14px;font-weight:600;color:var(--ink)}
.todo-item.dn .ttitle{text-decoration:line-through;color:var(--dim)}
.tdue{font-size:11px;color:var(--dim);background:#F0F0F0;padding:1px 7px;border-radius:2px}
.tdue.ov{background:#FFEBEE;color:var(--red);font-weight:600}
.tmemo{font-size:12px;color:var(--dim);margin-top:2px}
.epage{text-align:center;padding:48px 20px;background:#fff;border:1px solid var(--line)}
.eicon{font-size:40px;margin-bottom:10px}
.epage h3{font-size:15px;font-weight:700;margin-bottom:4px}
.epage p{font-size:13px;color:var(--dim)}

/* ── 모달 ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:#fff;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;border:1px solid var(--line2)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid var(--green)}
.mhead h3{font-size:15px;font-weight:700}
.mclose{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--dim);line-height:1}
.mbody{padding:16px}
.mact{display:flex;justify-content:flex-end;gap:6px;padding:12px 16px;border-top:1px solid var(--line)}
.bsec{margin-bottom:16px}
.bsec h4{font-size:13px;font-weight:700;margin-bottom:4px}
.bsec p{font-size:12px;color:var(--soft);margin-bottom:8px;line-height:1.5}
.filabel{display:inline-block;padding:7px 12px;background:var(--green);color:#fff;font-size:12px;font-weight:600;cursor:pointer;border-radius:2px}
input.fiinput{display:none}

/* ── 모바일 하단 탭 ── */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:200}
.bnavi{display:flex}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;background:transparent;border:none;cursor:pointer;font-size:10px;color:var(--dim);font-family:inherit}
.nbtn.on{color:var(--green);font-weight:600}
.nbtn-icon{font-size:18px;line-height:1}

@media(max-width:768px){
  .main{padding:110px 0 70px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .result-grid{grid-template-columns:1fr}
  .tabnav-inner{padding:0 8px}
  .tabitem{padding:0 12px;font-size:13px}
  .tabitem{display:none}
  .bnav{display:block}
  .box-body{padding:10px}
  .calc-field{grid-template-columns:1fr;gap:4px}
  .nsrch input{width:120px}
  .main .box,.main .calc-section,.main .result-area,.main .ksnet-wrap{border-left:none;border-right:none}

  /* ── 입출금 테이블 → 모바일 카드형 ── */
  .ntable-wrap{border:none;overflow:visible;background:transparent}
  table.nt{display:block}
  table.nt thead{display:none}
  table.nt tfoot{display:none}
  table.nt tbody{display:flex;flex-direction:column;gap:8px}
  table.nt tbody tr{
    display:flex;flex-direction:column;
    background:#fff;border:1px solid var(--line);
    border-radius:4px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05)
  }
  table.nt tbody td{padding:0;border-bottom:none;font-size:13px;display:flex;align-items:center}
  /* 날짜 행 - 헤더 역할 */
  table.nt tbody td:nth-child(1){
    background:linear-gradient(to right,#F0FFF6,#F7FFF9);
    border-bottom:1px solid #D4F0E0;
    padding:9px 12px;font-weight:700;font-size:13px
  }
  table.nt tbody td:nth-child(1)::before{content:'📅';margin-right:6px;font-size:13px}
  table.nt tbody td:nth-child(1) input{font-size:13px;font-weight:700;color:#1A1A1A;flex:1}
  /* 입금/출금 행 */
  table.nt tbody td:nth-child(2),
  table.nt tbody td:nth-child(3){
    display:grid;grid-template-columns:70px 1fr;
    border-bottom:1px solid #F5F5F5;padding:0
  }
  table.nt tbody td:nth-child(2)::before{
    content:'📥 입금';font-size:11px;font-weight:700;
    color:#0A7D3F;background:#F0FFF6;
    padding:10px 8px;border-right:1px solid #E0F5E8;
    display:flex;align-items:center;white-space:nowrap
  }
  table.nt tbody td:nth-child(3)::before{
    content:'📤 출금';font-size:11px;font-weight:700;
    color:#C53030;background:#FFF5F5;
    padding:10px 8px;border-right:1px solid #FFE0E0;
    display:flex;align-items:center;white-space:nowrap
  }
  table.nt tbody td:nth-child(2) input,
  table.nt tbody td:nth-child(3) input{padding:10px 10px;font-size:13px;width:100%}
  /* 잔액 행 */
  table.nt tbody td:nth-child(4){
    background:#F8FFF8;border-bottom:1px solid #F0F0F0;
    display:grid;grid-template-columns:70px 1fr;padding:0
  }
  table.nt tbody td:nth-child(4)::before{
    content:'💰 잔액';font-size:11px;font-weight:700;
    color:#1A56DB;background:#EEF4FF;
    padding:10px 8px;border-right:1px solid #D0E0FF;
    display:flex;align-items:center;white-space:nowrap
  }
  table.nt tbody td:nth-child(4) .bc{padding:10px 10px;font-size:14px;font-weight:800}
  /* 카테고리 행 */
  table.nt tbody td:nth-child(5){
    border-bottom:1px solid #F5F5F5;
    display:grid;grid-template-columns:70px 1fr;padding:0
  }
  table.nt tbody td:nth-child(5)::before{
    content:'📂 분류';font-size:11px;font-weight:700;
    color:#505050;background:#F5F5F5;
    padding:10px 8px;border-right:1px solid #E5E5E5;
    display:flex;align-items:center;white-space:nowrap
  }
  table.nt tbody td:nth-child(5) .csel{padding:10px 8px;font-size:13px}
  /* 세금계산서 행 */
  table.nt tbody td:nth-child(6){
    border-bottom:1px solid #F5F5F5;
    display:grid;grid-template-columns:70px 1fr;padding:0
  }

const ST={};
function fbSave(path,data){clearTimeout(ST[path]);ST[path]=setTimeout(async function(){try{await set(ref(db,path),data);setSbar("ok");}catch(e){setSbar("err");}},400);}
function saveRows(){fbSave("cashbook/rows",S.rows);}

function setSbar(st){var b=document.getElementById("sbar"),sp=document.getElementById("spill"),st2=document.getElementById("stxt");if(!b||!sp||!st2)return;sp.className="sync-pill "+st;if(st==="ok")st2.textContent="동기화 완료";else if(st==="ing")st2.textContent="연결 중";else st2.textContent="오프라인";}

async function init(){
  try{
    var snap=await get(ref(db,"cashbook"));
    if(!snap.exists()){
      await set(ref(db,"cashbook/rows"),IV);
      await set(ref(db,"cashbook/todos"),[]);
      await set(ref(db,"cashbook/products"),PRODUCTS.map(function(p){return Object.assign({},p);}));
    }
    onValue(ref(db,"cashbook/rows"),function(sn){S.rows=sn.val()?Object.values(sn.val()):[];render();});
    onValue(ref(db,"cashbook/todos"),function(sn){S.todos=sn.val()?Object.values(sn.val()):[];render();});
    onValue(ref(db,"cashbook/products"),function(sn){
      if(sn.val()){
        var arr=Array.isArray(sn.val())?sn.val():Object.values(sn.val());
        S.products=arr.filter(Boolean);
      }
      // products가 없으면 기존 PRODUCTS 기본값 유지
      if(!S.products||!S.products.length) S.products=PRODUCTS.map(function(p){return Object.assign({},p);});
      // QTY 재동기화
      S.products.forEach(function(p){if(QTY[p.id]===undefined)QTY[p.id]=0;});
      render();
    });
    setSbar("ok");
  }catch(e){
    setSbar("err");
    S.rows=IV;S.todos=[];S.products=PRODUCTS.map(function(p){return Object.assign({},p);});
    render();
  }
}

function render(){
  var root=document.getElementById("root");
  if(!root)return;
  var ac=S.todos.filter(function(t){return!t.done;}).length;
  var tabs=[{id:"ledger",icon:"📒",label:"입출금장부"},{id:"calc",icon:"🧮",label:"수수료 계산"},{id:"price",icon:"💰",label:"가격표"},{id:"quote",icon:"📋",label:"견적서"},{id:"todo",icon:"✓",label:"할일관리",badge:ac}];
  var tabHtml=tabs.map(function(t){return'<button class="tabitem '+(S.tab===t.id?"on":"")+'" onclick="sw(\''+t.id+'\')">'+t.icon+" "+t.label+(t.badge?'<span class="nbadge">'+t.badge+"</span>":"")+"</button>";}).join("");
  var bnav=tabs.map(function(t){return'<button class="nbtn '+(S.tab===t.id?"on":"")+'" onclick="sw(\''+t.id+'\')"><span class="nbtn-icon">'+t.icon+"</span>"+t.label.slice(0,4)+(t.badge?'<span class="nbadge">'+t.badge+"</span>":"")+"</button>";}).join("");
  var body="";
  if(S.tab==="ledger")body=renderLedger();
  else if(S.tab==="calc")body=renderCalc();
  else if(S.tab==="price")body=renderPrice();
  else if(S.tab==="quote")body=renderQuote();
  else if(S.tab==="todo")body=renderTodo();
  if(S.modal==="backup")body+=renderBackup();
  root.innerHTML=
    '<div class="topbar"><div class="topbar-inner">'
    +'<a class="logo"><div class="logo-icon">장</div><div><div class="logo-text">사업자장부</div><div class="logo-sub">POS·VAN 대리점</div></div></a>'
    +'<div id="spill" class="sync-pill ing"><div class="sdot"></div><span id="stxt">연결 중</span></div>'
    +'<button class="btn-backup" onclick="openBackup()">💾 백업</button>'
    +'</div></div>'
    +'<div class="tabnav"><div class="tabnav-inner">'+tabHtml+'</div></div>'
    +'<div class="main">'+body+'</div>'
    +'<nav class="bnav"><div class="bnavi">'+bnav+"</div></nav>";
}

function renderLedger(){
  var fm=S.ledger.fm,fc=S.ledger.fc,q=S.ledger.search;
  var sorted=[].concat(S.rows).sort(function(a,b){return(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id);});
  var run=0;
  var wb=sorted.map(function(r){run+=(r.deposit||0)-(r.withdraw||0);return Object.assign({},r,{balance:run});});
  var months=[...new Set(S.rows.map(function(r){return mk(r.date);}).filter(Boolean))].sort().reverse();
  var fil=wb.filter(function(r){
    if(fm!=="all"&&!(r.date||"").startsWith(fm))return false;
    if(fc!=="all"&&r.category!==fc)return false;
    if(q&&!(r.memo||"").toLowerCase().includes(q.toLowerCase()))return false;
    return true;
  });
  var td=fil.reduce(function(s,r){return s+(r.deposit||0);},0);
  var tw=fil.reduce(function(s,r){return s+(r.withdraw||0);},0);
  var cb=wb.length?wb[wb.length-1].balance:0;
  var tp=S.rows.filter(function(r){return(r.deposit||r.withdraw)&&!r.taxInvoice;}).length;
  var mOpts=months.map(function(m){return'<option value="'+m+'" '+(fm===m?"selected":"")+'>'+m.replace("-",".")+'월</option>';}).join("");
  var dOpts=DC.map(function(c){return'<option value="'+c.id+'" '+(fc===c.id?"selected":"")+'>'+c.label+"</option>";}).join("");
  var wOpts=WC.map(function(c){return'<option value="'+c.id+'" '+(fc===c.id?"selected":"")+'>'+c.label+"</option>";}).join("");
  var rows=fil.length===0?'<tr><td colspan="8" class="ec">'+(S.rows.length===0?"거래 내역이 없습니다.":"조건에 맞는 거래가 없습니다.")+"</td></tr>":fil.map(renderRow).join("");
  var foot=fil.length?'<tfoot><tr><td><b>소계</b></td><td class="r" style="color:#0A7D3F"><b>'+fmt(td)+'</b></td><td class="r" style="color:#E03030"><b>'+fmt(tw)+'</b></td><td class="r"><b>'+fmt(td-tw)+"</b></td><td colspan='4'></td></tr></tfoot>":"";
  return '<div class="kpi-grid">'
    +'<div class="kpi"><div class="kpi-label">총 입금</div><div class="kpi-val" style="color:#0A7D3F">+'+fmt(td)+'원</div></div>'
    +'<div class="kpi"><div class="kpi-label">총 출금</div><div class="kpi-val" style="color:#E03030">-'+fmt(tw)+'원</div></div>'
    +'<div class="kpi"><div class="kpi-label">현재 잔액</div><div class="kpi-val" style="color:'+(cb>=0?"#1A73E8":"#E03030")+'">'+fmt(cb)+'원</div></div>'
    +'<div class="kpi" style="'+(tp>0?"background:#FFF8E1":"")+'"><div class="kpi-label">세금계산서 미처리</div><div class="kpi-val" style="color:'+(tp>0?"#FF8F00":"#888")+';font-size:22px">'+tp+'건</div></div>'
    +'</div>'
    +'<div class="box"><div class="box-head"><span class="box-title">거래 내역</span><span class="cnt">'+fil.length+'건</span></div>'
    +'<div class="box-body">'
    +'<div class="toolbar">'
    +'<button class="btn-green" onclick="addRow()">+ 새 거래</button>'
    +'<select class="nsel" onchange="setFM(this.value)"><option value="all" '+(fm==="all"?"selected":"")+'">전체 기간</option>'+mOpts+'</select>'
    +'<select class="nsel" onchange="setFC(this.value)"><option value="all" '+(fc==="all"?"selected":"")+'>전체 카테고리</option><optgroup label="입금">'+dOpts+'</optgroup><optgroup label="출금">'+wOpts+'</optgroup></select>'
    +'<div class="nsrch"><input placeholder="비고 검색" value="'+esc(q)+'" oninput="setQ(this.value)">'+(q?'<button class="xbtn" onclick="setQ(\'\')">×</button>':"")+'</div>'
    +'<button class="btn-line ml-auto" onclick="expCSV()">CSV 내보내기</button>'
    +'</div></div>'
    +'<div class="ntable-wrap"><table class="nt"><thead><tr>'
    +'<th style="width:110px">날짜</th><th class="r" style="width:110px">입금</th><th class="r" style="width:110px">출금</th><th class="r" style="width:110px">잔액</th>'
    +'<th style="width:110px">카테고리</th><th class="c" style="width:66px">세금계산서</th><th>비고</th><th style="width:56px"></th>'
    +'</tr></thead><tbody>'+rows+"</tbody>"+foot+"</table></div>"
    +'<div class="hint">입금 시 세금계산서 <b>발행여부</b> / 출금 시 <b>수신여부</b></div>'

function renderRow(r){
  var isD=!!r.deposit,isW=!!r.withdraw;
  var cl=isD?DC:isW?WC:[];
  var cat=AC.find(function(c){return c.id===r.category;});
  var cOpts='<option value="">미분류</option>'+cl.map(function(c){return'<option value="'+c.id+'" '+(r.category===c.id?"selected":"")+'>'+c.label+"</option>";}).join("");
  return '<tr><td><input type="date" class="ci" style="color-scheme:light" value="'+(r.date||"")+'" onchange="updR(\''+r.id+'\',\'date\',this.value)"></td>'
    +'<td class="r"><input type="text" inputmode="numeric" class="ci nr dc" value="'+(r.deposit!=null?fmt(r.deposit):"")+'" placeholder="-" onfocus="nf(this)" onblur="nb(this,\''+r.id+'\',\'deposit\')" oninput="ni(this)"></td>'
    +'<td class="r"><input type="text" inputmode="numeric" class="ci nr wc" value="'+(r.withdraw!=null?fmt(r.withdraw):"")+'" placeholder="-" onfocus="nf(this)" onblur="nb(this,\''+r.id+'\',\'withdraw\')" oninput="ni(this)"></td>'
    +'<td class="r bc" style="color:'+(r.balance>=0?"#1A73E8":"#E03030")+'">'+fmt(r.balance)+"</td>"
    +'<td><select class="csel" '+(cat?'style="color:'+cat.color+';font-weight:600"':"")+' '+((!isD&&!isW)?"disabled":"")+' onchange="updR(\''+r.id+'\',\'category\',this.value)">'+cOpts+"</select></td>"
    +'<td class="txcell"><label class="txck"><input type="checkbox" '+(r.taxInvoice?"checked":"")+' '+((!isD&&!isW)?"disabled":"")+' onchange="updR(\''+r.id+'\',\'taxInvoice\',this.checked)"><span class="txbox">'+(r.taxInvoice?"✓":"")+'</span><span class="txhint">'+(isD?"발행":isW?"수신":"—")+"</span></label></td>"
    +'<td><input type="text" class="ci" value="'+esc(r.memo||"")+'" placeholder="메모" onchange="updR(\''+r.id+'\',\'memo\',this.value)"></td>'
    +'<td class="ac"><button class="ib" onclick="dupR(\''+r.id+'\')">⎘</button><button class="ib del" onclick="delR(\''+r.id+'\')">×</button></td></tr>';

window.nf=function(el){el.value=el.value.replace(/,/g,"");el.select();};
window.ni=function(el){el.value=el.value.replace(/[^\d]/g,"");};

    +'<button class="todo-filter-btn '+(fil==="active"?"on":"")+'" onclick="setTF(\'active\')">진행중 <span class="n">'+ac+'</span></button>'
    +'<button class="todo-filter-btn '+(fil==="done"?"on":"")+'" onclick="setTF(\'done\')">완료 <span class="n">'+dc+'</span></button>'

window.impBackup=function(input){
  var f=input.files[0];if(!f)return;
  if(!confirm("복원하시겠습니까? 현재 데이터가 덮어씌워집니다.")){input.value="";return;}
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!Array.isArray(data.rows))throw new Error("잘못된 백업 파일");
      S.rows=data.rows;S.todos=Array.isArray(data.todos)?data.todos:[];
      await Promise.all([set(ref(db,"cashbook/rows"),S.rows),set(ref(db,"cashbook/todos"),S.todos)]);
      alert("복원 완료! 거래 "+S.rows.length+"건, 할일 "+S.todos.length+"건");
      closeModal();
    }catch(err){alert("복원 실패: "+err.message);}
    input.value="";
  };
  reader.readAsText(f);
};
function dl(content,name,type){var b=new Blob([content],{type:type});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

function renderPrice(){
  var prods=S.products||PRODUCTS;
  var pm=S.priceModal;

  var cards=prods.map(function(p,i){
    var imgSrc=p.img||"";
    return '<div class="pcard">'
      +'<div class="pcard-img">'
        +'<span class="pcard-num">No.'+(i+1)+'</span>'
        +(imgSrc?'<img src="'+imgSrc+'" alt="'+esc(p.name)+'">':'<div style="font-size:32px;color:#DDD">📦</div>')
      +'</div>'
      +'<div class="pcard-body">'
        +'<div class="pcard-name">'+esc(p.name)+'</div>'
        +'<div class="pcard-prices">'
          +'<span class="pcard-buy">매입가 '+fmtN(p.buy)+'원</span>'
          +'<span class="pcard-sell">'+fmtN(p.sell)+'원</span>'
          +'<span class="pcard-vat">VAT 별도</span>'
        +'</div>'
        +'<div class="pcard-spec">'+esc(p.spec||"").split("\n").join("<br>")+'</div>'
        +'<div class="pcard-badges">'
          +'<span class="pbadge-sell">💳 판매</span>'
          +'<span class="pbadge-monthly">📅 월 관리비 '+(p.monthly>0?fmtN(p.monthly)+'원 ('+(p.monthlyNote||"별도")+')':"무상")+'</span>'
        +'</div>'
        +'<div class="pcard-actions">'
          +'<button class="pcard-edit-btn" onclick="openPriceModal(&apos;'+p.id+'&apos;)">✏️ 수정</button>'
          +'<button class="pcard-del-btn" onclick="delProduct(&apos;'+p.id+'&apos;)">🗑 삭제</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }).join("");

  var modalHtml="";
  if(pm.show){
    var f=pm.form;
    var isEdit=!!pm.editId;
    modalHtml='<div class="mbg" onclick="closePriceModal()">'
      +'<div class="modal" onclick="event.stopPropagation()" style="max-width:500px">'
        +'<div class="mhead"><h3>'+(isEdit?"✏️ 상품 수정":"➕ 상품 추가")+'</h3><button class="mclose" onclick="closePriceModal()">×</button></div>'
        +'<div class="mbody">'
          +'<div class="pm-field"><label class="pm-label">상품명 *</label><input class="pm-input" id="pm-name" value="'+esc(f.name)+'" placeholder="예: IMU-NA250P" oninput="pmUpdate(&apos;name&apos;,this.value)"></div>'
          +'<div class="pm-field"><label class="pm-label">사양 설명</label><textarea class="pm-input pm-textarea" id="pm-spec" placeholder="사양 정보를 입력하세요..." oninput="pmUpdate(&apos;spec&apos;,this.value)">'+esc(f.spec)+'</textarea></div>'
          +'<div class="pm-row">'
            +'<div class="pm-field"><label class="pm-label">매입가 (원)</label><input class="pm-input" id="pm-buy" type="number" value="'+f.buy+'" placeholder="0" oninput="pmUpdate(&apos;buy&apos;,this.value)"></div>'
            +'<div class="pm-field"><label class="pm-label">판매가 (원) *</label><input class="pm-input" id="pm-sell" type="number" value="'+f.sell+'" placeholder="0" oninput="pmUpdate(&apos;sell&apos;,this.value)"></div>'
          +'</div>'
          +'<div class="pm-row">'
            +'<div class="pm-field"><label class="pm-label">월 관리비 (원)</label><input class="pm-input" id="pm-monthly" type="number" value="'+f.monthly+'" placeholder="0 = 무상" oninput="pmUpdate(&apos;monthly&apos;,this.value)"></div>'
            +'<div class="pm-field"><label class="pm-label">관리비 구분</label><select class="pm-input" id="pm-note" onchange="pmUpdate(&apos;monthlyNote&apos;,this.value)"><option value="별도" '+(f.monthlyNote==="별도"?"selected":"")+'>별도</option><option value="무상" '+(f.monthlyNote==="무상"?"selected":"")+'>무상</option></select></div>'
          +'</div>'
          +'<div class="pm-field">'
            +'<label class="pm-label">상품 이미지</label>'
            +'<div class="pm-img-area">'
              +(f.img?'<img src="'+f.img+'" class="pm-preview">':'<div class="pm-img-placeholder">📷 이미지 없음</div>')
              +'<label class="pm-img-btn">📁 이미지 선택<input type="file" accept="image/*" style="display:none" onchange="pmImgChange(this)"></label>'
              +(f.img?'<button class="pm-img-clear" onclick="pmUpdate(&apos;img&apos;,&apos;&apos;)">× 이미지 제거</button>':"")
            +'</div>'
          +'</div>'
        +'</div>'
        +'<div class="mact">'
          +'<button class="bg" onclick="closePriceModal()">취소</button>'
          +'<button class="btn-green" onclick="savePriceModal()">'+(isEdit?"수정 완료":"상품 추가")+'</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }

  return '<div class="box" style="margin-bottom:10px">'
      +'<div class="box-head"><span class="box-title">💰 장비 가격표</span>'
      +'<button class="btn-green" onclick="openPriceModal(null)" style="font-size:12px;padding:6px 12px">+ 상품 추가</button></div>'
    +'</div>'
    +'<div class="price-grid">'+cards+'</div>'
    +'<div class="box"><div class="box-body" style="font-size:12px;color:#888;line-height:1.8">'
      +'· 모든 가격은 부가세(VAT) 별도 금액입니다<br>'
      +'· 세트 구성·수량 구매 시 별도 견적 제공 가능합니다'
    +'</div></div>'
    +modalHtml;
}

window.openPriceModal=function(id){
  if(id){
    var p=(S.products||PRODUCTS).find(function(x){return String(x.id)===String(id);});
    if(!p)return;
    S.priceModal={show:true,editId:id,form:{name:p.name||"",spec:p.spec||"",buy:p.buy||"",sell:p.sell||"",monthly:p.monthly||0,monthlyNote:p.monthlyNote||"별도",img:p.img||""}};
  }else{
    S.priceModal={show:true,editId:null,form:{name:"",spec:"",buy:"",sell:"",monthly:0,monthlyNote:"별도",img:""}};
  }
  render();
};
window.closePriceModal=function(){S.priceModal.show=false;render();};
window.pmUpdate=function(f,v){S.priceModal.form[f]=v;};
window.pmImgChange=function(input){
  var file=input.files[0];if(!file)return;
  if(file.size>2*1024*1024){alert("이미지 크기는 2MB 이하로 선택해주세요.");return;}
  var reader=new FileReader();
  reader.onload=function(e){
    S.priceModal.form.img=e.target.result;
    render();
  };
  reader.readAsDataURL(file);
};
window.savePriceModal=function(){
  var f=S.priceModal.form;
  if(!f.name.trim()){alert("상품명을 입력해주세요.");return;}
  if(!f.sell){alert("판매가를 입력해주세요.");return;}
  var prods=S.products?[].concat(S.products):PRODUCTS.map(function(p){return Object.assign({},p);});
  if(S.priceModal.editId){
    prods=prods.map(function(p){
      if(String(p.id)!==String(S.priceModal.editId))return p;
      return Object.assign({},p,{name:f.name.trim(),spec:f.spec.trim(),buy:Number(f.buy)||0,sell:Number(f.sell),monthly:Number(f.monthly)||0,monthlyNote:f.monthlyNote,img:f.img});
    });
  }else{
    var newId=uid();
    prods.push({id:newId,name:f.name.trim(),spec:f.spec.trim(),buy:Number(f.buy)||0,sell:Number(f.sell),monthly:Number(f.monthly)||0,monthlyNote:f.monthlyNote,img:f.img});
    QTY[newId]=0;
  }
  S.products=prods;
  saveProducts();
  S.priceModal.show=false;
  render();
};
window.delProduct=function(id){
  if(!confirm("이 상품을 삭제하시겠습니까?"))return;
  S.products=(S.products||[]).filter(function(p){return String(p.id)!==String(id);});
  saveProducts();
  render();
};


/* ── 견적서 ── */
function renderQuote(){
  var d=new Date();
  var dateStr=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일";
  var qc=buildQContent();

  var prodRows=(S.products||PRODUCTS).map(function(p){
    return '<div class="qprod-row '+(QTY[p.id]>0?"sel":"")+'" id="qrow-'+p.id+'">'
      +'<div class="qprod-left">'
        +'<img class="qprod-img" src="'+p.img+'" alt="'+p.name+'">'
        +'<div>'
          +'<div class="qname">'+p.name+'</div>'
          +'<div class="qspec">'+p.spec.split('\n').join(' · ')+'</div>'
          +'<div class="qprices">'
            +'<span class="qsell">'+fmtN(p.sell)+'원</span>'
            +'<span class="qvat-tag">VAT 별도</span>'
            +'<span class="qbuy">매입 '+fmtN(p.buy)+'원</span>'
            +'<span class="qmon">📅 '+(p.monthly>0?fmtN(p.monthly)+'원':'무상')+'</span>'
          +'</div>'
        +'</div>'
      +'</div>'
      +'<div class="qty-ctrl">'
        +'<button class="qty-btn" onclick="chQty('+p.id+',-1)">−</button>'
        +'<input class="qty-inp" type="number" id="qi-'+p.id+'" value="'+QTY[p.id]+'" min="0" oninput="inQty('+p.id+',this.value)">'
        +'<button class="qty-btn" onclick="chQty('+p.id+',+1)">+</button>'
      +'</div>'
    +'</div>';
  }).join("");

  return '<div class="quote-wrap">'

    +'<div class="qbox">'
      +'<div class="qbox-head"><span class="qbox-title">🧾 견적서</span><span style="font-size:11px;color:#888">'+dateStr+'</span></div>'
      +'<div class="qinner">'

        +'<div class="qinner-left">'
          +'<div class="qmeta">'
            +'<div class="qmeta-field" style="grid-column:1/-1"><label class="qmeta-label">상호명</label><input class="qmeta-input" id="qm-co" placeholder="예: ○○마트" oninput="refreshQ()"></div>'
            +'<div class="qmeta-field"><label class="qmeta-label">담당자</label><input class="qmeta-input" id="qm-name" placeholder="홍길동" oninput="refreshQ()"></div>'
            +'<div class="qmeta-field"><label class="qmeta-label">연락처</label><input class="qmeta-input" id="qm-tel" placeholder="010-0000-0000" oninput="refreshQ()"></div>'
          +'</div>'
          +'<div class="qmode">'
            +'<button class="qmode-btn '+(QMODE==="sell"?"on":"")+'" onclick="setQM(&apos;sell&apos;)">💳 판매 견적</button>'
            +'<button class="qmode-btn '+(QMODE==="monthly"?"on":"")+'" onclick="setQM(&apos;monthly&apos;)">📅 월 관리비 견적</button>'
          +'</div>'
          +'<div class="qitems" id="qi-panel">'+qc.items+'</div>'
        +'</div>'

        +'<div class="qinner-right">'
          +'<div id="q-total-area" style="flex:1">'+(qc.hasItems?'<div class="qtotal">'+qc.total+'</div>':"")+'</div>'
          +'<div class="qspecial">'
            +'<label class="qspecial-label">📋 특약사항</label>'
            +'<textarea class="qspecial-input" id="qm-special" placeholder="특약사항을 입력하세요 (예: 무상 A/S 1년, 설치비 별도 등)" oninput="setQSpecial(this.value)">'+esc(QSPECIAL)+'</textarea>'
          +'</div>'
          +'<div class="qactions">'
            +'<button class="qbtn-p" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>'
            +'<button class="qbtn-r" onclick="resetQ()">↺ 초기화</button>'
          +'</div>'
        +'</div>'
      +'</div>'
    +'</div>'

    +'<div class="qbox">'
      +'<div class="qbox-head"><span class="qbox-title">📦 장비 선택</span><span style="font-size:11px;color:#888">수량 입력 → 위 견적서에 자동 반영</span></div>'
      +prodRows
    +'</div>'

  +'</div>';
}

function buildQContent(){
  var sel=(S.products||PRODUCTS).filter(function(p){return QTY[p.id]>0;});
  var hasItems=sel.length>0||ADJUST.length>0;
  if(!hasItems) return {items:'<div class="qempty">장비를 선택하면 자동으로 표시됩니다</div>',total:"",hasItems:false};

  var supply=0,monthly=0;
  // 상품 항목 (이미지 포함)
  var rows=sel.map(function(p){
    var q=QTY[p.id];
    var price=QMODE==="sell"?p.sell:p.monthly;
    var amt=price*q;
    supply+=QMODE==="sell"?p.sell*q:0;
    monthly+=p.monthly*q;
    var amtStr=QMODE==="sell"?fmtN(p.sell)+"원 × "+q+" = <b>"+fmtN(amt)+"원</b>":(p.monthly>0?fmtN(p.monthly)+"원 × "+q+" = <b>"+fmtN(amt)+"원/월</b>":'<b>무상</b>');
    var imgHtml=p.img?'<img class="qitem-img" src="'+p.img+'">':'<div class="qitem-img-ph">📦</div>';
    return '<div class="qitem-row">'
      +'<div class="qitem-info">'+imgHtml+'<div class="qitem-name">'+esc(p.name)+'</div></div>'
      +'<div class="qitem-qty">'+q+'대</div>'
      +'<div class="qitem-amt">'+amtStr+'</div>'
    +'</div>';
  }).join("");

  // 확정된 할인/조정 항목 (읽기 전용 표시)
  var adjustRows=ADJUST.map(function(a){
    var amt=Number(a.amount)||0;
    if(QMODE==="sell")supply+=amt; else monthly+=amt;
    var sign=amt>=0?"+":"";
    var color=amt>=0?"#1A73E8":"#C53030";
    return '<div class="qitem-row qadjust-row">'
      +'<div class="qitem-info">'
        +'<span class="qadjust-icon">'+(amt<0?"🏷️":"➕")+'</span>'
        +'<span class="qadjust-name">'+esc(a.label)+'</span>'
      +'</div>'
      +'<div class="qitem-qty"></div>'
      +'<div class="qitem-amt" style="color:'+color+';font-weight:700">'
        +sign+fmtN(amt)+'원'
        +'<button class="qadjust-del" onclick="delAdjust(&apos;'+a.id+'&apos;)">×</button>'
      +'</div>'
    +'</div>';
  }).join("");

  // 할인/조정 입력 폼 (부호 버튼 방식)
  var addForm='<div class="qadjust-form">'
    +'<div class="qadjust-form-title">🏷️ 할인 / 조정 항목 추가</div>'
    +'<div class="qadjust-sign-row">'
      +'<button class="qadjust-sign-btn minus '+(ADJFORM.sign<0?"on":"")+'" onclick="setAdjSign(-1)">➖ 할인</button>'
      +'<button class="qadjust-sign-btn plus '+(ADJFORM.sign>0?"on":"")+'" onclick="setAdjSign(1)">➕ 추가비용</button>'
    +'</div>'
    +'<div class="qadjust-form-row">'
      +'<input class="qadjust-form-label" id="adj-label" placeholder="명칭 (예: 단골할인, 설치비)" value="'+esc(ADJFORM.label)+'" oninput="setAdjForm(&apos;label&apos;,this.value)">'
      +'<input class="qadjust-form-amount" id="adj-amount" type="number" inputmode="numeric" placeholder="금액" value="'+esc(ADJFORM.amount)+'" oninput="setAdjForm(&apos;amount&apos;,this.value)">'
      +'<button class="qadjust-form-btn" onclick="commitAdjust()">추가</button>'
    +'</div>'
    +'<div class="qadjust-form-hint">💡 위에서 <b style="color:#C53030">할인</b> 또는 <b style="color:#1A73E8">추가비용</b>을 선택하고 금액을 입력하세요 (숫자만)</div>'
  +'</div>';

  var allRows=rows+adjustRows+addForm;

  var totalHtml="";
  if(QMODE==="sell"){
    var s=Math.max(0,supply); // 음수 방지는 안 함 (할인으로 음수 가능성 표시)
    var vat=Math.round(supply*0.1),total=supply+vat;
    totalHtml='<div class="qtrow"><span class="qtl">공급가액</span><span class="qtv">'+fmtN(supply)+'원</span></div>'
      +'<div class="qtrow"><span class="qtl">부가세(10%)</span><span class="qtv">'+fmtN(vat)+'원</span></div>'
      +'<div class="qtrow main"><span class="qtl">총 합계</span><span class="qtv">'+fmtN(total)+'원</span></div>'
      +'<div class="qvat">※ 공급가액 '+fmtN(supply)+'원 + VAT '+fmtN(vat)+'원</div>';
  }else{
    var mVat=Math.round(monthly*0.1),mTotal=monthly+mVat;
    totalHtml='<div class="qtrow"><span class="qtl">월 관리비 (공급가)</span><span class="qtv">'+fmtN(monthly)+'원/월</span></div>'
      +'<div class="qtrow"><span class="qtl">부가세(10%)</span><span class="qtv">'+fmtN(mVat)+'원</span></div>'
      +'<div class="qtrow main blue"><span class="qtl" style="font-size:14px;font-weight:800">월 합계 (VAT 포함)</span><span class="qtv" style="color:#1A56DB">'+fmtN(mTotal)+'원/월</span></div>'
      +'<div class="qvat">※ 공급가 '+fmtN(monthly)+'원 + VAT '+fmtN(mVat)+'원</div>';
  }
  return {items:allRows,total:totalHtml,hasItems:true};
}
window.setAdjForm=function(f,v){ADJFORM[f]=v;};
window.setAdjSign=function(s){ADJFORM.sign=s;render();};
window.commitAdjust=function(){
  var le=document.getElementById("adj-label"),ae=document.getElementById("adj-amount");
  var label=((le?le.value:ADJFORM.label)||"").trim();
  var raw=ae?ae.value:ADJFORM.amount;
  var num=Math.abs(Number(raw)); // 절대값으로 받음
  if(raw===""||isNaN(num)){alert("금액을 입력해주세요.");return;}
  if(num===0){alert("0원은 추가할 수 없습니다.");return;}
  var sign=ADJFORM.sign||-1;
  var amount=num*sign; // 부호 버튼에 따라 +/- 적용
  if(!label)label=sign<0?"할인":"추가비용";
  ADJUST.push({id:uid(),label:label,amount:amount});
  ADJFORM={label:"",amount:"",sign:ADJFORM.sign}; // 부호는 유지
  render();
};
window.delAdjust=function(id){
  ADJUST=ADJUST.filter(function(a){return a.id!==id;});
  render();
};

function fmtN(n){return Number(n).toLocaleString("ko-KR");}
window.chQty=function(id,d){QTY[id]=Math.max(0,(QTY[id]||0)+d);var el=document.getElementById("qi-"+id);if(el)el.value=QTY[id];updQRow(id);refreshQPanel();};
window.inQty=function(id,v){QTY[id]=Math.max(0,parseInt(v)||0);updQRow(id);refreshQPanel();};
function updQRow(id){var r=document.getElementById("qrow-"+id);if(r)r.className="qprod-row "+(QTY[id]>0?"sel":"");};
function refreshQPanel(){
  var qc=buildQContent();
  // 항목 패널 갱신
  var panel=document.getElementById("qi-panel");
  if(panel)panel.innerHTML=qc.items;
  // 합계 패널 갱신
  var totalEl=document.getElementById("q-total-area");
  if(totalEl){
    if(qc.hasItems){
      totalEl.innerHTML='<div class="qtotal">'+qc.total+'</div>';
      totalEl.style.display="block";
    }else{
      totalEl.innerHTML="";
      totalEl.style.display="none";
    }
  }
}
window.refreshQ=function(){refreshQPanel();};
window.setQM=function(m){QMODE=m;render();};
window.setQSpecial=function(v){QSPECIAL=v;};
window.resetQ=function(){
  ADJUST=[];QSPECIAL="";ADJFORM={label:"",amount:"",sign:-1};
  (S.products||PRODUCTS).forEach(function(p){QTY[p.id]=0;var el=document.getElementById("qi-"+p.id);if(el)el.value=0;updQRow(p.id);});
  ["qm-co","qm-name","qm-tel"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  refreshQPanel();
};

init();
</script>
